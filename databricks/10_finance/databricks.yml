# Databricks Asset Bundle for the WWI_Finance SSIS project (ssis/10_finance).
# Deploy: databricks bundle validate -t dev && databricks bundle deploy -t dev
bundle:
  name: wwi_10_finance

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse used by ad-hoc validation queries (not required by the job)
    default: ""
  businessDate:
    description: Business date (yyyy-MM-dd) the close runs for; AccountingPeriod defaults to its yyyy-MM
    default: "1900-01-01"
  environmentCode:
    description: Environment code recorded on etl.batch / used for configuration lookups
    default: DEV
  accountingPeriod:
    description: Accounting period yyyy-MM to close; blank derives it from businessDate
    default: ""
  allowCloseWithVariance:
    description: Master_Finance_Close AllowCloseWithVariance - when False an out-of-tolerance tie-out fails the job
    default: "False"
  varianceTolerance:
    description: FIN_Reconcile_SubledgerToGl VarianceTolerance (functional currency units)
    default: "1"
  ledgerScope:
    description: FIN_Close_PeriodLock LedgerScope (ALL or a ledger code)
    default: ALL
  allocationRuleSet:
    description: FIN_Load_CostAllocation AllocationRuleSet
    default: STANDARD
  failOnMissingRate:
    description: FIN_Currency_Revaluation FailOnMissingRate
    default: "True"
  jurisdictionScope:
    description: FIN_Load_WithholdingTax JurisdictionScope (ALL or a jurisdiction code)
    default: ALL
targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environmentCode: DEV

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      environmentCode: PROD
    run_as:
      user_name: ${workspace.current_user.userName}
