resources:
  pipelines:
    sales_facts_pipeline:
      name: sales_facts_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      photon: true
      channel: CURRENT
      # Triggered, not continuous: the legacy Master_Daily_ETL ran once nightly;
      # the intraday reload becomes a second trigger of the same pipeline.
      continuous: false
      configuration:
        sales_facts.dimension_schema: ${var.dimension_schema}
        sales_facts.landing_root: ${var.landing_root}
      root_path: "../src"
      libraries:
        - glob:
            include: ../src/transformations/**
      environment:
        dependencies:
          - --editable ${workspace.file_path}
