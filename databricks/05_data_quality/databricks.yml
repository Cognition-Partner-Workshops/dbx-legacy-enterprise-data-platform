# Databricks Asset Bundle for the WWI_DataQuality SSIS project (ssis/05_data_quality).
# One job (resources/wwi_05_data_quality.job.yml) with one task per legacy DQ_* package.
bundle:
  name: wwi_05_data_quality

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze / silver / gold / etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse used by ad-hoc validation queries (not required by the job itself).
    default: ""
  businessDate:
    description: Default BusinessDate (yyyy-MM-dd) for manual runs; the master job overrides it.
    default: "1900-01-01"
  environmentCode:
    description: Legacy EnvironmentCode used for etl.configuration lookups (MaxRejectPercent etc.).
    default: DEV
  dbx_etl_common_wheel:
    description: >-
      Workspace path of the dbx_etl_common wheel published by session 00 (databricks/common).
      Installed into the serverless environment of every task.
    default: /Workspace/Shared/wwi/libs/dbx_etl_common-0.1.0-py3-none-any.whl

sync:
  include:
    - notebooks/**
    - src/**
    - validation/**
  exclude:
    - tests/**
    - "**/__pycache__/**"

targets:
  dev:
    mode: development
    default: true
    variables:
      environmentCode: DEV
  prod:
    mode: production
    variables:
      environmentCode: PROD
