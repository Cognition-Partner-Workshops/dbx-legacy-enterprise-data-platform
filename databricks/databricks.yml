# Declarative Automation Bundle for the sales lakehouse.
# Job definitions live in resources/*.yml; the integration session wires
# them together. Deploy: databricks bundle deploy -t dev
bundle:
  name: wwi_sales_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all sales_* schemas
    default: wwi_sales
  mock_data_root:
    description: Volume/DBFS path holding the generated mock source CSVs
    default: /Volumes/wwi_sales/sales_bronze/mock_source

targets:
  dev:
    mode: development
    default: true
