# One job for the WWI_Staging project. Task keys are the legacy package names.
# Phase "Stage Load" (orchestration-plan sequence 30, four parallel streams) -> the 24 STG_Load_* tasks;
# phase "Stage Work Tables" (sequence 35) -> the 4 STG_Work_* tasks, gated on the stg tables they read
# (docs/inventories/package-dependencies.csv). Intra-load edges are the stg.* Lookup components in the
# .dtsx (e.g. STG_Load_Order looks up stg.Customer) which the legacy 4-stream scheduler left to timing.
resources:
  jobs:
    wwi_04_staging:
      name: wwi_04_staging
      description: SSIS WWI_Staging (ssis/04_staging) migrated to Delta silver.stg_*/work_*/err_* notebooks.
      tags:
        legacy_project: WWI_Staging
        migration_session: "04"
      max_concurrent_runs: 1
      timeout_seconds: 14400
      queue:
        enabled: true
      parameters:
        - name: BatchId
          default: "0"
        - name: BusinessDate
          default: ${var.businessDate}
        - name: ReloadFullHistory
          default: "False"
        - name: EnvironmentCode
          default: ${var.environmentCode}
        - name: RestartFromStep
          default: ""
        - name: catalog
          default: ${var.catalog}
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - "../../common/dbx_etl_common/dist/*.whl"
      tasks:
        - task_key: STG_Load_ApInvoice
          depends_on:
            - task_key: STG_Load_CostCenter
            - task_key: STG_Load_Currency
            - task_key: STG_Load_TaxAndTerms
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_ApInvoice.py
          max_retries: 0
        - task_key: STG_Load_CostCenter
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_CostCenter.py
          max_retries: 0
        - task_key: STG_Load_Currency
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_Currency.py
          max_retries: 0
        - task_key: STG_Load_Customer
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_Customer.py
          max_retries: 0
        - task_key: STG_Load_CustomerAddress
          depends_on:
            - task_key: STG_Load_Geography
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_CustomerAddress.py
          max_retries: 0
        - task_key: STG_Load_Employee
          depends_on:
            - task_key: STG_Load_Currency
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_Employee.py
          max_retries: 0
        - task_key: STG_Load_Geography
          depends_on:
            - task_key: STG_Load_PromotionAndTerritory
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_Geography.py
          max_retries: 0
        - task_key: STG_Load_GlJournal
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_GlJournal.py
          max_retries: 0
        - task_key: STG_Load_LoyaltyLedger
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_LoyaltyLedger.py
          max_retries: 0
        - task_key: STG_Load_Order
          depends_on:
            - task_key: STG_Load_Customer
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/STG_Load_Order.py
          max_retries: 0
        - task_key: STG_Load_PartnerSale
          environment_key: default
