# Databricks Asset Bundle for the WWI_Staging SSIS project (ssis/04_staging).
# 24 STG_Load_* + 4 STG_Work_* packages -> one notebook each, one job `wwi_04_staging`.
bundle:
  name: wwi_04_staging

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse used by SQL-flavoured validation tasks (unused by the notebook tasks).
    default: ""
  businessDate:
    description: Business date (yyyy-MM-dd) the staging run processes; empty means "today" in dbx_etl_common.params.
    default: ""
  environmentCode:
    description: Legacy etl.Configuration EnvironmentCode.
    default: DEV
  job_cluster_spark_version:
    default: 15.4.x-scala2.12
  job_cluster_node_type:
    default: Standard_D8ds_v5
  min_workers:
    default: 2
  max_workers:
    default: 8

sync:
  include:
    - notebooks/**
    - src/**
    - validation/**

targets:
  dev:
    mode: development
    default: true
    variables:
      environmentCode: DEV
  prod:
    mode: production
    variables:
      environmentCode: PROD
      min_workers: 4
      max_workers: 16
    run_as:
      service_principal_name: ${workspace.current_user.userName}
