              projectJob: wwi_15_error_handling
              package: ERR_Reconcile_RowCounts
              jobParameters: "{\"BatchId\":\"{{tasks.Start_Batch.values.BatchId}}\",\"BusinessDate\":\"{{job.parameters.BusinessDate}}\",\"EnvironmentCode\":\"{{job.parameters.EnvironmentCode}}\",\"ReloadFullHistory\":\"{{job.parameters.ReloadFullHistory}}\",\"RestartFromStep\":\"{{job.parameters.RestartFromStep}}\",\"catalog\":\"{{job.parameters.catalog}}\"}"
              extraJobParameters: "{}"
              skipIfSucceeded: "false"
              stepName: "Close Escalation"
          environment_key: default
          depends_on:
            - task_key: ERR_Notify_Operations
        - task_key: Close_Escalation__end
          description: "plan-node: Close Escalation | kind=phase role=end"
          notebook_task:
            notebook_path: "../notebooks/step_end.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Finance_Close
              jobRunId: "{{job.run_id}}"
              BatchStepId: "{{tasks.Close_Escalation__start.values.BatchStepId}}"
              stepName: "Close Escalation"
              childTaskKeys: "[\"ERR_Notify_Operations\",\"ERR_Reconcile_RowCounts\"]"
              edges: "[]"
              variables: "{}"
          environment_key: default
          depends_on:
            - task_key: ERR_Reconcile_RowCounts
          run_if: ALL_DONE
        - task_key: Read_Subledger_Variance
          description: "plan-node: Read Subledger Variance | kind=control control=query"
          notebook_task:
            notebook_path: "../notebooks/control_node.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Finance_Close
              jobRunId: "{{job.run_id}}"
              mode: query
              edges: "[{\"expression\":\"@[User::SubledgerVariance] == 0 || @[$Package::AllowCloseWithVariance]\",\"key\":\"edge_7\"},{\"expression\":\"@[User::SubledgerVariance] != 0 && !@[$Package::AllowCloseWithVariance]\",\"key\":\"edge_8\"}]"
              statement: "{\"sql\":\"SELECT coalesce(SUM(ABS(ra.SourceRowCount - ra.TargetRowCount)), 0) AS Variance FROM etl.RowCountAudit AS ra INNER JOIN etl.PackageExecution AS pe ON pe.PackageExecutionId = ra.PackageExecutionId WHERE pe.BatchId = :p0 AND ra.ObjectName IN ('Fact.Payment', 'Fact.GL Posting')\"}"
              statementParameters: "[\"User::BatchId\"]"
              resultVariable: "User::SubledgerVariance"
              variables: "{\"$Package::AllowCloseWithVariance\":{\"default\":false,\"ref\":\"{{job.parameters.AllowCloseWithVariance}}\"},\"User::BatchId\":{\"default\":0,\"ref\":\"{{tasks.Start_Batch.values.BatchId}}\"},\"User::SubledgerVariance\":{\"default\":0,\"ref\":0}}"
          environment_key: default
          depends_on:
            - task_key: gate_6_Subledger_Tie_Out__Read_Subledger_Variance
              outcome: "true"
        - task_key: Reconcile_Row_Counts
          description: "plan-node: Reconcile Row Counts | kind=reconcile ;; plan-edge: Period Lock -> Reconcile Row Counts | value=Success"
          notebook_task:
            notebook_path: "../notebooks/reconcile.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Finance_Close
              jobRunId: "{{job.run_id}}"
              BatchId: "{{tasks.Start_Batch.values.BatchId}}"
              raiseOnFailure: "false"
              edges: "[]"
              variables: "{}"
          environment_key: default
          depends_on:
            - task_key: Period_Lock__end
        - task_key: End_Batch
          description: "plan-node: End Batch | kind=batch_end ;; plan-edge: Reconcile Row Counts -> End Batch | value=Success"
          notebook_task:
            notebook_path: "../notebooks/batch_end.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Finance_Close
              jobRunId: "{{job.run_id}}"
              BatchId: "{{tasks.Start_Batch.values.BatchId}}"
              forceStatus: ""
              edges: "[]"
              variables: "{}"
          environment_key: default
          depends_on:
            - task_key: Reconcile_Row_Counts
        - task_key: End_Batch_With_Warnings
          description: "plan-node: End Batch With Warnings | kind=batch_end ;; plan-edge: Close Escalation -> End Batch With Warnings | value=Success"
          notebook_task:
            notebook_path: "../notebooks/batch_end.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Finance_Close
              jobRunId: "{{job.run_id}}"
              BatchId: "{{tasks.Start_Batch.values.BatchId}}"
              forceStatus: SucceededWithWarnings
              edges: "[]"
              variables: "{}"
          environment_key: default
          depends_on:
            - task_key: Close_Escalation__end
        - task_key: gate_1_Read_Period_Status__Subledger_Loads
          description: "plan-edge: Read Period Status -> Subledger Loads | value=Success expression=@[User::PeriodStatus] != \"Closed\""
          depends_on:
            - task_key: Read_Period_Status
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.Read_Period_Status.values.edge_1}}"
            right: "true"
        - task_key: gate_2_Read_Period_Status__Close_Escalation
          description: "plan-edge: Read Period Status -> Close Escalation | value=Success expression=@[User::PeriodStatus] == \"Closed\""
          depends_on:
            - task_key: Read_Period_Status
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.Read_Period_Status.values.edge_2}}"
            right: "true"
        - task_key: gate_6_Subledger_Tie_Out__Read_Subledger_Variance
          description: "plan-edge: Subledger Tie Out -> Read Subledger Variance | value=Completion"
          depends_on:
            - task_key: Subledger_Tie_Out__end
          condition_task:
            op: EQUAL_TO
            left: "true"
            right: "true"
          run_if: ALL_DONE
        - task_key: gate_7_Read_Subledger_Variance__Close_Aggregates
          description: "plan-edge: Read Subledger Variance -> Close Aggregates | value=Success expression=@[User::SubledgerVariance] == 0 || @[$Package::AllowCloseWithVariance]"
          depends_on:
            - task_key: Read_Subledger_Variance
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.Read_Subledger_Variance.values.edge_7}}"
            right: "true"
        - task_key: gate_8_Read_Subledger_Variance__Close_Escalation
          description: "plan-edge: Read Subledger Variance -> Close Escalation | value=Success expression=@[User::SubledgerVariance] != 0 && !@[$Package::AllowCloseWithVariance]"
          depends_on:
            - task_key: Read_Subledger_Variance
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.Read_Subledger_Variance.values.edge_8}}"
            right: "true"
        - task_key: zz_close_batch_if_open
          description: "helper: mirrors the runner's finally block (Invoke-EstateOrchestration.ps1) - not a plan node"
          notebook_task:
            notebook_path: "../notebooks/close_batch_if_open.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Finance_Close
              jobRunId: "{{job.run_id}}"
              BatchId: "{{tasks.Start_Batch.values.BatchId}}"
          environment_key: default
          depends_on:
            - task_key: End_Batch
            - task_key: End_Batch_With_Warnings
          run_if: ALL_DONE
