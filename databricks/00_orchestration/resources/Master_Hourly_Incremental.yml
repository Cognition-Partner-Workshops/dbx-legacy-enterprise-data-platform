            right: "true"
          run_if: ALL_DONE
        - task_key: zz_close_batch_if_open
          description: "helper: mirrors the runner's finally block (Invoke-EstateOrchestration.ps1) - not a plan node"
          notebook_task:
            notebook_path: "../notebooks/close_batch_if_open.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Hourly_Incremental
              jobRunId: "{{job.run_id}}"
              BatchId: "{{tasks.Start_Batch.values.BatchId}}"
          environment_key: default
          depends_on:
            - task_key: End_Batch
            - task_key: Log_Stand_Down
          run_if: ALL_DONE
