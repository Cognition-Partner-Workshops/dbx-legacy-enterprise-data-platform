            right: "true"
        - task_key: gate_4_Purge__Statistics
          description: "plan-edge: Purge -> Statistics | value=Success expression=@[$Package::SkipIndexRebuild] || @[$Package::MaintenanceWindowMinutes] < 120"
          depends_on:
            - task_key: Purge__end
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.Purge__end.values.edge_4}}"
            right: "true"
        - task_key: gate_5_Index_Maintenance__Statistics
          description: "plan-edge: Index Maintenance -> Statistics | value=Completion"
          depends_on:
            - task_key: Index_Maintenance__end
          condition_task:
            op: EQUAL_TO
            left: "true"
            right: "true"
          run_if: ALL_DONE
        - task_key: gate_6_Statistics__Archive
          description: "plan-edge: Statistics -> Archive | value=Completion"
          depends_on:
            - task_key: Statistics__end
          condition_task:
            op: EQUAL_TO
            left: "true"
            right: "true"
          run_if: ALL_DONE
        - task_key: gate_7_Archive__Reject_Housekeeping
          description: "plan-edge: Archive -> Reject Housekeeping | value=Completion"
          depends_on:
            - task_key: Archive__end
          condition_task:
            op: EQUAL_TO
            left: "true"
            right: "true"
          run_if: ALL_DONE
        - task_key: gate_8_Reject_Housekeeping__End_Batch
          description: "plan-edge: Reject Housekeeping -> End Batch | value=Completion"
          depends_on:
            - task_key: Reject_Housekeeping__end
          condition_task:
            op: EQUAL_TO
            left: "true"
            right: "true"
          run_if: ALL_DONE
        - task_key: zz_close_batch_if_open
          description: "helper: mirrors the runner's finally block (Invoke-EstateOrchestration.ps1) - not a plan node"
          notebook_task:
            notebook_path: "../notebooks/close_batch_if_open.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Weekly_Maintenance
              jobRunId: "{{job.run_id}}"
              BatchId: "{{tasks.Start_Batch.values.BatchId}}"
          environment_key: default
          depends_on:
            - task_key: End_Batch
          run_if: ALL_DONE
