          notebook_task:
            notebook_path: "../notebooks/control_node.py"
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              masterName: Master_Intraday_Inventory
              jobRunId: "{{job.run_id}}"
              mode: query
              edges: "[{\"expression\":\"@[$Package::PickingWindowOpen] && @[User::OnHandVariance] <= @[$Package::OnHandVarianceTolerance]\",\"key\":\"edge_9\"},{\"expression\":\"@[User::OnHandVariance] > @[$Package::OnHandVarianceTolerance]\",\"key\":\"edge_10\"}]"
              statement: "{\"sql\":\"SELECT coalesce(MAX(ABS(ra.SourceRowCount - ra.TargetRowCount)), 0) AS OnHandVariance FROM etl.RowCountAudit AS ra INNER JOIN etl.PackageExecution AS pe ON pe.PackageExecutionId = ra.PackageExecutionId WHERE pe.BatchId = :p0 AND ra.ObjectName = 'Fact.Stock Holding'\"}"
              statementParameters: "[\"User::BatchId\"]"
              resultVariable: "User::OnHandVariance"
              variables: "{\"$Package::OnHandVarianceTolerance\":{\"default\":25,\"ref\":\"{{job.parameters.OnHandVarianceTolerance}}\"},\"$Package::PickingWindowOpen\":{\"default\":true,\"ref\":\"{{job.parameters.PickingWindowOpen}}\"},\"User::BatchId\":{\"default\":0,\"ref\":\"{{tasks.Start_Batch.values.BatchId}}\"},\"User::OnHandVariance\":{\"default\":0,\"ref\":0}}"
          environment_key: default
          depends_on:
            - task_key: gate_8_Inventory_Marts__Read_On_Hand_Variance
              outcome: "true"
