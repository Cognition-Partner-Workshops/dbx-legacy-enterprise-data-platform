# Databricks Asset Bundle for the SSIS master packages (ssis/00_orchestration -> 9 Databricks Jobs).
# resources/*.yml are GENERATED by databricks/00_orchestration/tools/build_jobs_from_plan.py from ssis/orchestration-plan.json.
bundle:
  name: wwi_00_orchestration

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding bronze/silver/gold/etl (naming contract).
    default: wwi_${bundle.target}
  schedule_timezone:
    description: Timezone the legacy SQL Agent schedules ran in.
    default: UTC
  schedule_pause_status:
    description: PAUSED or UNPAUSED for the masters that were enabled in the legacy estate (Month End and Finance Close are always PAUSED).
    default: PAUSED
  extract_retry_task_retries:
    description: Task-level retries on the *retry-phase* child tasks; with the plan's first pass + retry pass this equals MaxExtractAttempts (3) attempts.
    default: 1
  extract_retry_interval_millis:
    description: Wait between task-level retries of a retry-phase child.
    default: 300000

targets:
  dev:
    mode: development          # pauses every schedule and prefixes job names, like databricks/common
    default: true
    variables:
      catalog: wwi_dev
      schedule_pause_status: PAUSED
  prod:
    mode: production
    workspace:
      # one copy per deploying identity; run production deploys as a service principal (run_as)
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: wwi_prod
      schedule_pause_status: UNPAUSED
    permissions:
      - level: CAN_VIEW
        group_name: users
