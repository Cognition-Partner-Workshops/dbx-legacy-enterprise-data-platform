# Databricks Asset Bundle for SSIS project 07_dimensions (WWI_Dimensions).
# Validate offline: databricks bundle validate --strict --target dev
# (deployment is coordinated by session 00's master bundle; never deployed from this session)
bundle:
  name: wwi_07_dimensions

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse used by the reconciliation notebook when run interactively (not required by the job).
    default: ""
  businessDate:
    description: Business date (yyyy-MM-dd) the dimension loads process; empty means "today" (params.getJobParams).
    default: ""
  batchId:
    description: Batch id opened by the master orchestration; "0" lets each package adopt the running batch.
    default: "0"
  reloadFullHistory:
    description: Set to True to rebuild every dimension version from the full staging history.
    default: "False"
  environmentCode:
    description: etl.configuration environment (DEV / TEST / PROD).
    default: DEV
  restartFromStep:
    description: Master orchestration restart step name (unused inside this bundle, forwarded for parity).
    default: ""
  spark_version:
    description: Databricks Runtime for the job cluster (Delta MERGE with schema evolution requires DBR 13+).
    default: 15.4.x-scala2.12
  node_type_id:
    description: Job cluster node type.
    default: Standard_DS3_v2
  common_wheel:
    description: Path (relative to this bundle) of the shared dbx_etl_common wheel built by session 00.
    default: ../common/dist/dbx_etl_common-0.1.0-py3-none-any.whl

targets:
  dev:
    mode: development
    default: true
    variables:
      environmentCode: DEV
  prod:
    mode: production
    variables:
      environmentCode: PROD
    run_as:
      user_name: ${workspace.current_user.userName}
