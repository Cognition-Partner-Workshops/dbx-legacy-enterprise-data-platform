# Databricks Asset Bundle for the WWI_Sales SSIS project (ssis/11_sales).
# One job (wwi_11_sales) with one task per legacy SLS_* package.
bundle:
  name: wwi_11_sales

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse used for ad-hoc validation queries (not required by the job tasks).
    default: ""
  environment_code:
    description: Legacy EnvironmentCode passed to the control framework (DEV / TEST / PROD).
    default: DEV
  business_date:
    description: BusinessDate (yyyy-MM-dd). Empty string = today in the notebook.
    default: ""
  dbx_etl_common_whl:
    description: >-
      Workspace or volume path of the dbx_etl_common wheel built by databricks/common
      (session 00). Installed into the serverless task environment.
    default: /Workspace/Shared/wwi/common/dist/dbx_etl_common-0.1.0-py3-none-any.whl
  volume_root:
    description: >-
      UC Volume root used for the partner feed outbound/archive files.
      Empty string = /Volumes/<catalog>/etl/files (derived in the notebook).
    default: ""
  # Business parameters carried over from the legacy $Package:: parameters.
  commission_month:
    description: Calendar commission month (YYYY-MM) posted by the NA and EU commission loads. Empty = month of BusinessDate.
    default: ""
  house_account_rate_percent:
    description: Percentage of the NA plan rate paid on house accounts (SLS_NA_Load_Commission).
    default: "50"
  cash_basis_countries:
    description: Comma-separated EU countries accruing commission on cash receipt (SLS_EU_Load_Commission).
    default: DE,AT
  fiscal_period_445:
    description: 4-4-5 commission period posted by SLS_APAC_Load_Commission (YYYY-Pnn). Empty = period of BusinessDate.
    default: ""
  team_split_enabled:
    description: Apply the APAC plan's team-selling split percentages.
    default: "True"
  attainment_period:
    description: Quota period measured by SLS_Load_QuotaAttainment (YYYY-MM; APAC rows use the mapped 4-4-5 period). Empty = month of BusinessDate.
    default: ""
  include_partial_period:
    description: Include an in-flight period pro-rated to date (SLS_Load_QuotaAttainment).
    default: "True"
  attribution_mode:
    description: REGIONAL uses the per-region attribution window; STRICT uses the promotion window only.
    default: REGIONAL
  partner_scope:
    description: ALL, or a single partner code for a targeted re-send (SLS_Export_PartnerFeed).
    default: ALL
  suppress_unconsented_eu_rows:
    description: Drop EU partner-feed rows without a sharing consent.
    default: "True"

targets:
  dev:
    mode: development
    default: true
    variables:
      environment_code: DEV
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/wwi/.bundle/${bundle.name}/${bundle.target}
    variables:
      environment_code: PROD
      catalog: wwi_prod
