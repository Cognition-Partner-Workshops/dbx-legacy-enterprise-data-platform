# Databricks Asset Bundle for the legacy SSIS project WWI_Maintenance (ssis/99_maintenance).
# Validate: databricks bundle validate -t dev   (never deploy from a migration session)
bundle:
  name: wwi_99_maintenance

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse used by ad-hoc validation queries (not required by the job tasks).
    default: ""
  businessDate:
    description: Business date passed to the maintenance run as BusinessDate (yyyy-MM-dd).
    default: "1900-01-01"
  environmentCode:
    description: Legacy EnvironmentCode used to resolve etl.configuration rows.
    default: DEV
  landingVolumePath:
    description: UC Volume that replaces the C:\WWI\<ENV> landing share (inbound/, archive/, quarantine/).
    default: /Volumes/${var.catalog}/bronze/landing
  schedule_pause_status:
    description: The Saturday 22:00 trigger is a reference only; Master_Weekly_Maintenance (session 00) owns it.
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    variables:
      environmentCode: DEV
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environmentCode: PROD
      schedule_pause_status: PAUSED
