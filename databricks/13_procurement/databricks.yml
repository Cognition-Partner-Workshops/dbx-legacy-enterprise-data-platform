# Databricks Asset Bundle for the WWI_Procurement SSIS project (ssis/13_procurement).
bundle:
  name: wwi_13_procurement

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze / silver / gold / etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse id (reserved for SQL tasks / reconciliation queries).
    default: ""
  businessDate:
    description: Default BusinessDate (yyyy-MM-dd). Empty means "today" in dbx_etl_common.params.
    default: ""
  environmentCode:
    description: Legacy EnvironmentCode passed to the control framework.
    default: DEV
  spark_version:
    description: Databricks Runtime for the job cluster.
    default: 15.4.x-scala2.12
  node_type_id:
    description: Worker node type for the job cluster.
    default: Standard_DS3_v2
  dbx_etl_common_wheel:
    description: >
      Workspace path of the dbx_etl_common wheel built by session 00 (databricks/common). Attached
      to every task as a library; override per target once session 00 publishes the artifact.
    default: /Workspace/Shared/wwi/libs/dbx_etl_common-latest-py3-none-any.whl
  outbound_volume_path:
    description: UC Volume receiving the supplier statement files (replaces the WWI_Archive_Files share).
    default: /Volumes/${var.catalog}/etl/outbound
  archive_volume_path:
    description: UC Volume keeping the per-batch archived copy of every statement file.
    default: /Volumes/${var.catalog}/etl/archive

targets:
  dev:
    mode: development
    default: true
    variables:
      environmentCode: DEV
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environmentCode: PRD
      catalog: wwi_prod
    run_as:
      user_name: ${workspace.current_user.userName}
