# Job wwi_01_oracle_extract: one task per legacy EXT_ORA_* package (task_key = package name).
# Task edges: no package-to-package edges exist in docs/inventories/package-dependencies.csv
# (Master_Daily_ETL ran the 22 packages as 4 parallel streams of phase 'Extract Oracle'); the
# edges below are the data dependencies inside the phase: lookups against raw.OracleGeography /
# raw.OracleCostCenter, and packages that DELETE/append RecordKind slices of a sibling's raw table.
resources:
  jobs:
    wwi_01_oracle_extract:
      name: wwi_01_oracle_extract
      description: "WWI_Extract_Oracle: 22 EXT_ORA_* packages -> ${var.catalog}.bronze.raw_oracle_* (phase 'Extract Oracle' of Master_Daily_ETL)"
      tags:
        legacy_project: WWI_Extract_Oracle
        migration_session: "01"
      max_concurrent_runs: 1
      timeout_seconds: 21600
      parameters:
        - name: BatchId
          default: "0"
        - name: BusinessDate
          default: ${var.businessDate}
        - name: ReloadFullHistory
          default: "False"
        - name: EnvironmentCode
          default: ${var.environment_code}
        - name: RestartFromStep
          default: ""
        - name: catalog
          default: ${var.catalog}
      job_clusters:
        - job_cluster_key: oracle_extract_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.extract_workers}
            data_security_mode: SINGLE_USER
      tasks:
      - task_key: EXT_ORA_CustomerMaster
        description: "raw.OracleCustomerMaster <- WWI_MDM.CUST_MASTER (append)"
        job_cluster_key: oracle_extract_cluster
        libraries:
          - whl: "../../common/dbx_etl_common/dist/*.whl"
          - maven:
              coordinates: ${var.oracle_jdbc_coordinates}
        notebook_task:
          notebook_path: ../notebooks/EXT_ORA_CustomerMaster.py
          base_parameters:
            source_mode: ${var.source_mode}
            oracle_host: ${var.oracle_host}
            oracle_port: ${var.oracle_port}
            oracle_service: ${var.oracle_service}
            oracle_user: ${var.oracle_user}
            oracle_secret_scope: ${var.oracle_secret_scope}
            oracle_password_key: ${var.oracle_password_key}
            extract_volume_path: ${var.extract_volume_path}
            jdbc_fetch_size: ${var.jdbc_fetch_size}
            jdbc_num_partitions: ${var.jdbc_num_partitions}
      - task_key: EXT_ORA_CustomerAddress
        description: "raw.OracleCustomerAddress <- WWI_MDM.CUST_ADDRESS (append)"
        depends_on:
          - task_key: EXT_ORA_Geography
        job_cluster_key: oracle_extract_cluster
        libraries:
          - whl: "../../common/dbx_etl_common/dist/*.whl"
          - maven:
