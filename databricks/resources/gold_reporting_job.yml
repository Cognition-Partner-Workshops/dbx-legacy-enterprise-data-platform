# Gold job (workstream 7): aggregates -> report views -> quota / commission / partner feed.
# Runs after the fact job (workstream 6); the integration session adds the cross-job dependency.
resources:
  jobs:
    gold_reporting_job:
      name: "[${bundle.target}] wwi_sales_lakehouse - 30 gold reporting"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: mock_data_root
          default: ${var.mock_data_root}
      tasks:
        - task_key: gold_aggregates
          notebook_task:
            notebook_path: ../notebooks/30_gold/gold_aggregates.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              mock_data_root: "{{job.parameters.mock_data_root}}"
        - task_key: gold_reporting_views
          depends_on:
            - task_key: gold_aggregates
          notebook_task:
            notebook_path: ../notebooks/30_gold/gold_reporting_views.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              mock_data_root: "{{job.parameters.mock_data_root}}"
        - task_key: gold_sales_ops
          depends_on:
            - task_key: gold_aggregates
          notebook_task:
            notebook_path: ../notebooks/30_gold/gold_sales_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              mock_data_root: "{{job.parameters.mock_data_root}}"
