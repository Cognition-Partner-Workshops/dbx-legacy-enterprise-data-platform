# Bronze ingestion job: one notebook task that lands every registered mock CSV
# into <catalog>.sales_bronze.* (replaces the SSIS EXT_SQL_* / EXT_ORA_* packages).
resources:
  jobs:
    bronze_ingest:
      name: "[${bundle.target}] wwi_sales_lakehouse - 10 bronze ingest"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: mock_data_root
          default: ${var.mock_data_root}
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ../notebooks/10_bronze/ingest_bronze.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              mock_data_root: "{{job.parameters.mock_data_root}}"
              batch_id: "{{job.run_id}}"
