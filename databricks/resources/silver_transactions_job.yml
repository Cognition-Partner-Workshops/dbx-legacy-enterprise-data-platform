# Workstream 4: bronze -> silver sales transactions. Serverless notebook task;
# depends on the bronze ingest job having populated sales_bronze.
resources:
  jobs:
    silver_transactions:
      name: "[${bundle.target}] sales_lakehouse - silver transactions"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: mock_data_root
          default: ${var.mock_data_root}
      tasks:
        - task_key: silver_transactions
          notebook_task:
            notebook_path: ../notebooks/20_silver/silver_transactions.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              mock_data_root: "{{job.parameters.mock_data_root}}"
