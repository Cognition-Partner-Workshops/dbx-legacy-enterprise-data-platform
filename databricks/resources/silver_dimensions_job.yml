# Silver customers & dimensions stage (workstream 3).
# party_resolution -> customers (customer + dim_customer SCD2) -> dimensions
# (dim_sales_channel, dim_sales_territory, dim_salesperson, dim_buying_group,
# bridge_customer_buying_group).
resources:
  jobs:
    silver_dimensions:
      name: "[${bundle.target}] sales_lakehouse silver customers and dimensions"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: mock_data_root
          default: ${var.mock_data_root}
      tasks:
        - task_key: party_resolution
          notebook_task:
            notebook_path: ../notebooks/20_silver/party_resolution.py
        - task_key: customers
          depends_on:
            - task_key: party_resolution
          notebook_task:
            notebook_path: ../notebooks/20_silver/customers.py
        - task_key: dimensions
          depends_on:
            - task_key: customers
          notebook_task:
            notebook_path: ../notebooks/20_silver/dimensions.py
