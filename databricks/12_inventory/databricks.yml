# Databricks Asset Bundle for the WWI_Inventory SSIS project (ssis/12_inventory).
# Validate:  databricks bundle validate -t dev
# Deploy:    databricks bundle deploy -t dev   (coordinated by session 00; not run from this session)
bundle:
  name: wwi_12_inventory

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse used by ad-hoc validation queries (not required by the job).
    default: ""
  businessDate:
    description: Default BusinessDate (yyyy-MM-dd) when the job is run without one; empty = today.
    default: ""
  environmentCode:
    description: Legacy EnvironmentCode passed to the control framework.
    default: DEV
  common_wheel:
    description: Path to the dbx_etl_common wheel built by session 00 (databricks/common/dist).
    default: ../../common/dist/dbx_etl_common-0.1.0-py3-none-any.whl
  spark_version:
    default: 15.4.x-scala2.12
  node_type_id:
    default: Standard_DS3_v2
  max_workers:
    default: 4

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: wwi_dev
      environmentCode: DEV
  prod:
    mode: production
    variables:
      catalog: wwi_prod
      environmentCode: PROD
      max_workers: 8
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
