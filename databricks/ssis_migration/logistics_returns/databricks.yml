# Declarative Automation Bundle for SSIS group 8 (logistics_returns): 12 packages -> otterorders_migration.ssis_logistics_returns.
# Deploy: databricks bundle deploy -t dev        Run: databricks bundle run ssis_logistics_returns_daily_etl -t dev
bundle:
  name: ssis_logistics_returns

include:
  - resources/*.yml

variables:
  catalog:
    description: Migration catalog (pre-provisioned)
    default: otterorders_migration
  schema:
    description: Landing schema owned by this group (pre-provisioned)
    default: ssis_logistics_returns
  warehouse_id:
    description: Serverless SQL warehouse used for ad-hoc verification
    default: 565cd2fd713738c4
  git_sha:
    description: Commit that produced the deployed code (stamped into evidence.recon_results.git_sha)
    default: unknown

sync:
  exclude:
    - .ruff_cache
    - .pytest_cache
    - "**/__pycache__"
    - tests

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/logistics_returns

permissions:
  - level: CAN_MANAGE
    group_name: users
