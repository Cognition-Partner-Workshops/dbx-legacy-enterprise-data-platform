# Master_Hourly_Incremental slice: pick up new carrier_scan_*.csv files from the landing volume (ING_FILE_CarrierScan).
resources:
  jobs:
    ssis_logistics_returns_hourly_carrier_scan:
      name: ssis_logistics_returns_hourly_carrier_scan
      tags:
        ssis_group: logistics_returns
      max_concurrent_runs: 1
      parameters:
        - {name: catalog, default: "${var.catalog}"}
        - {name: schema, default: "${var.schema}"}
        - {name: git_sha, default: "${var.git_sha}"}
      trigger:
        pause_status: PAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/landing/inbound/carrier/
      tasks:
        - task_key: ING_FILE_CarrierScan
          notebook_task:
            notebook_path: ../notebooks/run_package.py
            base_parameters: {package: ING_FILE_CarrierScan}
