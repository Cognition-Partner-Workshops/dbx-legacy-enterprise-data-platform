# Master_Month_End slice: rebuild the trailing weeks of Aggregate.Delivery Performance Summary, then refresh evidence.
resources:
  jobs:
    ssis_logistics_returns_month_end_aggregate:
      name: ssis_logistics_returns_month_end_aggregate
      tags:
        ssis_group: logistics_returns
      max_concurrent_runs: 1
      parameters:
        - {name: catalog, default: "${var.catalog}"}
        - {name: schema, default: "${var.schema}"}
        - {name: git_sha, default: "${var.git_sha}"}
        - {name: reload_full_history, default: "false"}
      schedule:
        quartz_cron_expression: "0 0 3 1 * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: AGG_Refresh_DeliveryPerformanceSummary
          notebook_task:
            notebook_path: ../notebooks/run_package.py
            base_parameters: {package: AGG_Refresh_DeliveryPerformanceSummary}
        - task_key: recon
          depends_on: [{task_key: AGG_Refresh_DeliveryPerformanceSummary}]
          notebook_task:
            notebook_path: ../notebooks/recon.py
