# Unity Catalog volume standing in for the SSIS file share (C:\WWI\Landing): inbound/carrier, inbound/processed, inbound/failed, archive.
resources:
  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: landing
      volume_type: MANAGED
      comment: Landing zone for the ING_FILE_CarrierScan feed (carrier_scan_*.csv + .ctl sidecars)
