[project]
name = "ssis-logistics-returns"
version = "0.1.0"
description = "Databricks migration of the WWI SSIS logistics_returns package group"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# camelCase locals/functions are the org convention; ruff naming rules (N) are deliberately not enabled.

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F821"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
