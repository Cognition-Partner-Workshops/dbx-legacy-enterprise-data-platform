[project]
name = "sales_performance"
version = "0.1.0"
description = "Databricks-native reimplementation of the SSIS sales_performance package group"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
src = ["src", "tests", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "B905", "UP007", "UP035", "UP006"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F821"]
