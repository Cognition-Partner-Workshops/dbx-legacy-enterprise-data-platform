# Standalone month-end refresh of a single aggregate (the AGG_Refresh_* packages run outside the
# publish); parameter ``aggregate_table`` selects the target.
resources:
  jobs:
    ssis_sales_performance_agg_refresh:
      name: ssis_sales_performance_agg_refresh
      description: Run one AGG_Refresh_* package of the sales_performance group standalone (delete/rebuild window controlled by months_back).
      max_concurrent_runs: 1
      tags:
        ssis_group: sales_performance
      parameters:
        - name: batch_id
          default: "{{job.run_id}}"
        - name: aggregate_table
          default: gold_agg_monthly_sales_summary
        - name: months_back
          default: "0"
      tasks:
        - task_key: agg_refresh
          notebook_task:
            notebook_path: ../notebooks/refresh_aggregate.py
