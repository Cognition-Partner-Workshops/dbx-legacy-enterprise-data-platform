# Declarative Automation Bundle for the SSIS `sales_performance` package group.
bundle:
  name: ssis_sales_performance

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog the group lands into
    default: otterorders_migration
  schema:
    description: Landing schema owned by this group
    default: ssis_sales_performance
  warehouse_id:
    description: Serverless SQL warehouse used for ad-hoc verification
    default: 565cd2fd713738c4
  git_sha:
    description: Commit that produced the run (stamped on evidence rows)
    default: unknown

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/sales_performance
