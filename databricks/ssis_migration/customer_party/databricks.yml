# Declarative Automation Bundle for the customer_party SSIS package group (22 packages).
bundle:
  name: ssis_customer_party

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the landing schema and the evidence schema
    default: otterorders_migration
  schema:
    description: Landing schema owned exclusively by this group
    default: ssis_customer_party
  evidence_schema:
    description: Shared evidence schema (append-only)
    default: evidence
  warehouse_id:
    description: Serverless SQL warehouse used for reconciliation queries
    default: 565cd2fd713738c4
  batch_id:
    description: SSIS BatchId stamped on every row; defaults to the job run id so each run lands its own bronze batch
    default: "{{job.run_id}}"
  reload_full_history:
    description: SSIS ReloadFullHistory parameter for the incremental Oracle extracts
    default: "false"

# The bundle deliberately lives under /Workspace/Shared (required landing path for the migration factory).
permissions:
  - level: CAN_MANAGE
    group_name: users

sync:
  include:
    - src/**
    - notebooks/**

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/customer_party
