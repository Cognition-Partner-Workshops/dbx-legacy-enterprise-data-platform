# Declarative Automation Bundle for the WWI SSIS finance group (25 packages).
# Deploy: databricks bundle deploy -t dev   (root: /Workspace/Shared/ssis_migration/finance)
bundle:
  name: ssis_finance

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the migration schemas.
    default: otterorders_migration
  schema:
    description: Landing schema owned by the finance group.
    default: ssis_finance
  evidence_schema:
    description: Shared, append-only evidence schema.
    default: evidence
  warehouse_id:
    description: Serverless SQL warehouse used for ad-hoc verification.
    default: 565cd2fd713738c4
  git_sha:
    description: Commit of the PR head that produced the run (stamped into evidence rows).
    default: unknown
  accounting_period:
    description: Accounting period (YYYY-MM) the finance-close packages operate on.
    default: "2024-12"
  business_date:
    description: Business date the daily ETL runs for (YYYY-MM-DD); empty = today.
    default: "2024-12-31"

workspace:
  root_path: /Workspace/Shared/ssis_migration/finance

# The shared folder is mandated by the migration harness; make the resulting access explicit.
permissions:
  - level: CAN_MANAGE
    group_name: users

targets:
  dev:
    # no `mode: development`: the assignment fixes the root path to the shared folder and
    # the job names to the bare `ssis_finance_` prefix (development mode would force a user
    # path and a `[dev user]` name prefix).
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/finance
