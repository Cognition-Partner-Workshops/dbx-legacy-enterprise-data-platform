resources:
  jobs:
    ssis_finance_month_end:
      name: ssis_finance_month_end
      description: Master_Month_End (finance slice) - AGG_Refresh_FinanceCloseSummary
      tags:
        project: ssis_migration
        group: finance
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: evidence_schema
          default: ${var.evidence_schema}
        - name: accounting_period
          default: ${var.accounting_period}
        - name: business_date
          default: ${var.business_date}
        - name: git_sha
          default: ${var.git_sha}
        - name: allow_unbalanced_journals
          default: "false"
        - name: fail_on_missing_rate
          default: "false"
        - name: include_disputed
          default: "false"
        - name: ledger_scope
          default: ALL

      environments:
        - environment_key: default
          spec:
            environment_version: "3"
      tasks:
        - task_key: agg_refresh_finance_close_summary
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/run_packages.py
            base_parameters:
              packages: "AGG_Refresh_FinanceCloseSummary"
