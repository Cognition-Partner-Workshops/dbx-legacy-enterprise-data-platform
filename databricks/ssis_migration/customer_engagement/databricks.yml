# Declarative Automation Bundle for the WWI SSIS `customer_engagement` package group.
bundle:
  name: ssis_customer_engagement

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that owns the landing schema and the evidence schema.
    default: otterorders_migration
  schema:
    description: Landing schema owned exclusively by this package group.
    default: ssis_customer_engagement
  warehouse_id:
    description: Serverless SQL warehouse used for ad-hoc evidence queries.
    default: 565cd2fd713738c4
  as_of_date:
    description: "ISO date the C360/AGG windows are anchored on; 'auto' = MAX(Fact.Sale.[Invoice Date Key])."
    default: auto
  staging_source_mode:
    description: "'legacy_raw' reads wwi_legacy_staging.raw.*; 'bronze' reads the EXT_* bronze tables in this schema."
    default: legacy_raw
  default_region:
    description: Region applied when the legacy dimension/raw rows carry no region code.
    default: NA
  git_sha:
    description: Commit that produced the evidence run (set at deploy time).
    default: ""

workspace:
  root_path: /Workspace/Shared/ssis_migration/customer_engagement

permissions:
  - level: CAN_MANAGE
    group_name: users

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/customer_engagement
