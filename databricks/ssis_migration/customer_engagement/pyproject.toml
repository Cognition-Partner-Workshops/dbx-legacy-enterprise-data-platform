[project]
name = "ssis-customer-engagement"
version = "0.1.0"
description = "WWI SSIS customer_engagement package group on Databricks"
requires-python = ">=3.10"

[tool.ruff]
line-length = 180
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/customer_engagement/recon.py" = ["E501"]
