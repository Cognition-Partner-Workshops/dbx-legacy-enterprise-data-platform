[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "tools", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["F821", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
