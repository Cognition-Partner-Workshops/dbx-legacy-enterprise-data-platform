# Declarative Automation Bundle for SSIS migration group 10/10: platform_control.
# Orchestration (Master_*), control framework (etl.*), ERR_*, DQ_* and MNT_* packages.
bundle:
  name: ssis_platform_control

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that owns the landing schema.
    default: otterorders_migration
  schema:
    description: Landing schema owned exclusively by this migration group.
    default: ssis_platform_control
  evidence_schema:
    description: Shared, append-only evidence schema.
    default: evidence
  legacy_staging_catalog:
    description: Lakehouse Federation catalog over WideWorldImporters_Staging (read-only baseline).
    default: wwi_legacy_staging
  legacy_dw_catalog:
    description: Lakehouse Federation catalog over WideWorldImportersDW (read-only baseline).
    default: wwi_legacy_dw
  environment_code:
    description: Environment code stamped into etl_batch rows (matches etl.Configuration EnvironmentCode).
    default: DEV
  warehouse_id:
    description: Serverless SQL warehouse used by SQL tasks.
    default: 565cd2fd713738c4
  operator_email:
    description: Operations on-call mailbox for job failure notifications (SQL Agent operator "WWI ETL On-Call").
    default: ""
  schedule_pause_status:
    description: PAUSED in dev so orchestrators do not fire against sibling jobs that are not deployed yet.
    default: PAUSED
  git_sha:
    description: Commit that produced the deployed code; stamped into evidence rows.
    default: unknown
  sibling_dispatch_on_missing:
    description: skip | fail - what the dispatcher does when a sibling job ssis_<slug>_<package> is not deployed.
    default: skip

sync:
  include:
    - src/**
    - notebooks/**
    - config/**
    - samples/**
    - resources/**
  exclude:
    - tests/**
    - "**/__pycache__/**"

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-8bc9474f-40ae.cloud.databricks.com
      root_path: /Workspace/Shared/ssis_migration/platform_control
    variables:
      schedule_pause_status: PAUSED
