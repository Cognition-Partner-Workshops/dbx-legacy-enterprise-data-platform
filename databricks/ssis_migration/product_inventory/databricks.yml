bundle:
  name: ssis_product_inventory

variables:
  catalog:
    description: Unity Catalog catalog for landing + evidence
    default: otterorders_migration
  schema:
    description: Landing schema owned by this migration group
    default: ssis_product_inventory
  git_sha:
    description: Commit that produced the run (recorded in evidence)
    default: unknown

include:
  - resources/*.yml

permissions:
  - group_name: users
    level: CAN_MANAGE

targets:
  dev:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/product_inventory
    run_as:
      user_name: ${workspace.current_user.userName}
