bundle:
  name: ssis_ref_calendar

variables:
  git_sha:
    description: Commit of the PR head that produced the run (written to evidence.recon_results.git_sha).
    default: unknown
  warehouse_id:
    description: Serverless SQL warehouse used for ad-hoc verification.
    default: 565cd2fd713738c4

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - notebooks/**
    - samples/**
  exclude:
    - tests/**
    - .pytest_cache/**
    - "**/__pycache__/**"

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/ref_calendar
