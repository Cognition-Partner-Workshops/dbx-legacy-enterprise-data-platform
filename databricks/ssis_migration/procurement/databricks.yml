bundle:
  name: ssis_procurement

variables:
  catalog:
    default: otterorders_migration
  schema:
    default: ssis_procurement
  warehouse_id:
    default: 565cd2fd713738c4
  git_sha:
    description: Commit of the deployed code, recorded in evidence.recon_results.git_sha
    default: unknown

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - notebooks/**
    - samples/**
  exclude:
    - tests/**
    - "**/__pycache__/**"

permissions:
  - level: CAN_MANAGE
    group_name: users

targets:
  dev:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/procurement
    run_as:
      user_name: ${workspace.current_user.userName}
