# Standalone evidence run: recompute row-count/checksum parity for all 18 packages and
# append a fresh run_id to otterorders_migration.evidence.recon_results without reloading.
resources:
  jobs:
    ssis_sales_o2c_recon:
      name: ssis_sales_o2c_recon
      description: Reconciliation evidence only (no data movement) for the sales_o2c group.
      max_concurrent_runs: 1
      tags:
        ssis_group: sales_o2c
        harness: ssis-migration-v1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: evidence_schema
          default: ${var.evidence_schema}
        - name: git_sha
          default: ${var.git_sha}
        - name: batch_id
          default: "{{job.run_id}}"
      environments:
        - environment_key: serverless
          spec:
            client: "3"
      tasks:
        - task_key: recon
          notebook_task:
            notebook_path: ../notebooks/recon.py
