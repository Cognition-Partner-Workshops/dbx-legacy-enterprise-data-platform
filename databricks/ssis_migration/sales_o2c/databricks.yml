bundle:
  name: ssis_sales_o2c

include:
  - resources/*.yml

permissions:
  - level: CAN_MANAGE
    group_name: users

variables:
  catalog:
    description: Unity Catalog catalog that holds the migration schemas
    default: otterorders_migration
  schema:
    description: Landing schema owned by the sales_o2c group
    default: ssis_sales_o2c
  evidence_schema:
    description: Shared reconciliation-evidence schema (append-only)
    default: evidence
  warehouse_id:
    description: Serverless SQL warehouse used by SQL-flavoured tasks
    default: 565cd2fd713738c4
  git_sha:
    description: Commit that produced the run (stamped into evidence rows)
    default: local
  reload_full_history:
    description: Set to true to make every package ignore its watermark (SSIS ReloadFullHistory)
    default: "false"

targets:
  dev:
    # no `mode: development`: the assignment mandates a shared root_path, which development mode rejects
    default: true
    workspace:
      root_path: /Workspace/Shared/ssis_migration/sales_o2c
