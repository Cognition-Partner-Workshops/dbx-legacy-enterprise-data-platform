# Databricks Asset Bundle for the legacy SSIS project WWI_Aggregates (ssis/09_aggregates).
# Validate: databricks bundle validate -t dev   (never deploy from a migration session)
bundle:
  name: wwi_09_aggregates

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse for ad-hoc validation of the gold.rpt_* views (not required by the job tasks).
    default: ""
  businessDate:
    description: Business date passed to the aggregate refresh as BusinessDate (yyyy-MM-dd).
    default: "1900-01-01"
  environmentCode:
    description: Legacy EnvironmentCode used to resolve etl.configuration rows.
    default: DEV
  dbx_etl_common_wheel:
    description: Session 00's shared control-framework wheel (databricks/common, built with `python -m build`).
    default: ../common/dist/dbx_etl_common-0.1.0-py3-none-any.whl
  runMonthEndAggregates:
    description: >-
      "True" runs the ten month-end aggregates (Master_Month_End phases 20-50) in addition to the two daily ones;
      "False" reproduces the Master_Daily_ETL leg (daily aggregates + publication only).
    default: "True"
  publicationGroupCode:
    description: Publication group (DAILY, MONTHEND or ADHOC) resolved from etl.configuration / silver.int_reporting_publication.
    default: DAILY

targets:
  dev:
    mode: development
    default: true
    variables:
      environmentCode: DEV
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environmentCode: PROD
