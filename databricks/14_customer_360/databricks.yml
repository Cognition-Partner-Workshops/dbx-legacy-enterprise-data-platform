# Databricks Asset Bundle for the WWI_Customer360 SSIS project (ssis/14_customer_360).
# Validate:  databricks bundle validate -t dev      (no deploy from this session)
bundle:
  name: wwi_14_customer_360

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse id used by SQL-based validation queries (not used by the notebook tasks).
    default: ""
  businessDate:
    description: Business date (yyyy-MM-dd) the pipeline runs for; replaces SYSDATETIME() in the legacy T-SQL.
    default: "1900-01-01"
  environmentCode:
    description: Environment code passed to the etl.configuration lookups.
    default: DEV
targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: wwi_dev
      environmentCode: DEV
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: wwi_prod
      environmentCode: PROD
