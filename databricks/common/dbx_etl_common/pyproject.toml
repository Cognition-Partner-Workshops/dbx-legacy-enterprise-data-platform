[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx_etl_common"
version = "0.1.0"
description = "Shared Databricks control layer for the WideWorldImporters SSIS -> Databricks migration (re-implements sqlserver/control/procedures/*.sql against etl.* Delta tables)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "WWI data platform migration" }]
dependencies = []

[project.optional-dependencies]
local = ["pyspark>=3.5,<4", "delta-spark>=3.3,<4"]
test = ["pyspark>=3.5,<4", "delta-spark>=3.3,<4", "pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbx_etl_common = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
