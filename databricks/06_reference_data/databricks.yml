# Databricks Asset Bundle for the legacy SSIS project WWI_ReferenceData (ssis/06_reference_data).
# One job, wwi_06_reference_data, with one task per legacy REF_Load_* package (14 tasks).
bundle:
  name: wwi_06_reference_data

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze/silver/gold/etl schemas.
    default: wwi_${bundle.target}
  warehouse_id:
    description: SQL warehouse used for ad-hoc validation queries (not used by the job tasks).
    default: ""
  businessDate:
    description: Business date (yyyy-MM-dd) stamped into the job's BusinessDate parameter.
    default: "1900-01-01"
  environmentCode:
    description: Environment code (DEV/TEST/PROD) passed to the EnvironmentCode job parameter.
    default: DEV
  dateRangeStart:
    description: First calendar date generated by REF_Load_DateDimension (legacy spine started 2005-01-01).
    default: "2005-01-01"
  dateRangeEnd:
    description: Last calendar date generated by REF_Load_DateDimension (legacy spine ended 2035-12-31).
    default: "2035-12-31"
  ops_email:
    description: Operations distribution list for job-level failure notifications.
    default: wwi-etl-operations@example.invalid

targets:
  dev:
    mode: development
    default: true
    variables:
      environmentCode: DEV
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environmentCode: PROD
    permissions:
      - level: CAN_MANAGE
        group_name: wwi-etl-operators
