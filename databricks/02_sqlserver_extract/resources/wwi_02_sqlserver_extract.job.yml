# One job for the SSIS project WWI_Extract_SqlServer (ssis/02_sqlserver_extract).
# Task keys are the legacy package names. docs/inventories/package-dependencies.csv has no
# EXT_SQL_* -> EXT_SQL_* edge (all consumers are STG_* packages in other projects), and the
# legacy master ran the extracts as independent ExtractAttempt loops, so the 22 tasks have no
# depends_on and run in parallel; the retry settings replace the ExtractAttempt retry loop.
resources:
  jobs:
    wwi_02_sqlserver_extract:
      name: wwi_02_sqlserver_extract
      description: "Bronze ingestion of WideWorldImporters OLTP (SQL Server) - 22 EXT_SQL_* packages"
      tags:
        ssis_project: WWI_Extract_SqlServer
        layer: bronze
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: BatchId
          default: "0"
        - name: BusinessDate
          default: ${var.business_date}
        - name: ReloadFullHistory
          default: "False"
        - name: EnvironmentCode
          default: ${var.environment_code}
        - name: RestartFromStep
          default: ""
        - name: catalog
          default: ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "../../common/dbx_etl_common/dist/*.whl"
      tasks:
      - task_key: EXT_SQL_Orders
        environment_key: default
        notebook_task:
          notebook_path: ../notebooks/EXT_SQL_Orders.py
          base_parameters:
            SqlServerHost: ${var.sqlserver_host}
            SqlServerPort: ${var.sqlserver_port}
            SqlServerOltpDb: ${var.sqlserver_oltp_db}
            SqlServerTrustServerCertificate: ${var.sqlserver_trust_server_certificate}
            SqlServerSecretScope: ${var.sqlserver_secret_scope}
            SqlServerUserSecretKey: ${var.sqlserver_user_secret_key}
            SqlServerPasswordSecretKey: ${var.sqlserver_password_secret_key}
        timeout_seconds: 7200
        max_retries: 2
        min_retry_interval_millis: 300000
        retry_on_timeout: false
      - task_key: EXT_SQL_OrderLines
        environment_key: default
        notebook_task:
          notebook_path: ../notebooks/EXT_SQL_OrderLines.py
          base_parameters:
