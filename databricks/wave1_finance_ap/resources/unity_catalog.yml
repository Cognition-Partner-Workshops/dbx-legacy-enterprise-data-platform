# Wave-1 Unity Catalog objects. One bronze schema per legacy Oracle schema so the
# like-for-like table names survive (WWI_FIN.AP_INVOICE_HDR -> wave1_bronze_wwi_fin.ap_invoice_hdr).
resources:
  schemas:
    wave1_landing:
      catalog_name: ${var.catalog}
      name: ${var.landing_schema}
      comment: Wave 1 Finance AP landing area. Source extracts drop into the oracle_extract volume.
    wave1_bronze_wwi_fin:
      catalog_name: ${var.catalog}
      name: ${var.bronze_prefix}_wwi_fin
      comment: Bronze copy of Oracle WWI_FIN (AP subledger) extracts, raw types preserved.
    wave1_bronze_wwi_mdm:
      catalog_name: ${var.catalog}
      name: ${var.bronze_prefix}_wwi_mdm
      comment: Bronze copy of Oracle WWI_MDM supplier master extracts, raw types preserved.
    wave1_bronze_wwi_ref:
      catalog_name: ${var.catalog}
      name: ${var.bronze_prefix}_wwi_ref
      comment: Bronze copy of Oracle WWI_REF reference extracts consumed by wave 1.

  volumes:
    oracle_extract:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.wave1_landing.name}
      name: ${var.landing_volume}
      volume_type: MANAGED
      comment: >
        Landing volume for Oracle-shaped pipe-delimited extracts:
        oracle/<SCHEMA>/<TABLE>/*.dat plus oracle/_contracts/<SCHEMA>.<TABLE>.json.
