bundle:
  name: wave1_finance_ap_bronze

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that owns the wave-1 landing volume and bronze schemas.
    default: de_demo_workspace
  landing_schema:
    description: Schema holding the landing volume the source extracts drop into.
    default: wave1_landing
  landing_volume:
    description: Managed volume name under ${var.landing_schema}.
    default: oracle_extract
  bronze_prefix:
    description: >
      Prefix for the bronze schemas. One bronze schema per legacy Oracle schema:
      ${var.bronze_prefix}_wwi_fin, ${var.bronze_prefix}_wwi_mdm, ${var.bronze_prefix}_wwi_ref.
    default: wave1_bronze
  source_kind:
    description: >
      Which SourceReader implementation feeds bronze. volume_delimited reads the
      pipe-delimited Oracle-shaped extracts landed in the volume (synthetic today,
      a real sqlplus/Data Pump drop later). oracle_jdbc and lakehouse_federation
      are the drop-in real-source paths and are not wired to a live system here.
    default: volume_delimited
  source_tables:
    description: Comma-separated legacy SCHEMA.TABLE list bronze loads, in FK order.
    default: >-
      WWI_REF.PAYMENT_METHOD_REF,WWI_REF.FX_RATE_DAILY,
      WWI_MDM.SUPP_MASTER,WWI_MDM.SUPP_ADDRESS,WWI_MDM.SUPP_BANK_ACCOUNT,
      WWI_FIN.PAYMENT_TERMS,WWI_FIN.TAX_RATE,WWI_FIN.COST_CENTER,
      WWI_FIN.AP_INVOICE_HDR,WWI_FIN.AP_INVOICE_LINE,WWI_FIN.AP_INVOICE_HOLD,
      WWI_FIN.AP_PAYMENT,WWI_FIN.AP_PAYMENT_APPLY,WWI_FIN.AP_AGING_SNAPSHOT

targets:
  # Demo workspace. Host and token come from DATABRICKS_HOST / DATABRICKS_TOKEN
  # in the environment (exported from DATABRICKS_DEMO_HOST / DATABRICKS_DEMO_TOKEN);
  # nothing credential-shaped lives in this file.
  demo:
    default: true
  # Production target is intentionally absent: cutover is a customer-held
  # principal's action, not a migration-session deploy.
