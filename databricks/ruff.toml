# Lint configuration for the sales lakehouse (`ruff check databricks`).
line-length = 140
target-version = "py310"
extend-exclude = [".databricks", "build", "dist"]

# Databricks notebook globals injected at runtime.
builtins = ["dbutils", "spark", "display", "displayHTML"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# Notebooks bootstrap sys.path before importing sales_lakehouse (serverless notebook tasks).
"notebooks/**" = ["E402"]
# Mock generators and test fixtures are wide literal data tables; wrapping them hurts readability.
"src/sales_lakehouse/mock_data/**" = ["E501"]
# Generated by sales_lakehouse.bronze.generate_registry; tests assert it matches the generator byte for byte.
"src/sales_lakehouse/bronze/registry.py" = ["E501"]
"tests/**" = ["E501", "F811"]  # F811: pytest fixtures imported into the module and consumed as test parameters

[lint.isort]
known-first-party = ["sales_lakehouse", "tests"]
