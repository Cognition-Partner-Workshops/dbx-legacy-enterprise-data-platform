# Estate object catalog - GENERATED by tools/catalog/build_catalog.py. Do not hand-edit.
# This file is the contract every work package codes against: object names here
# must match the artefacts under oracle/, sqlserver/ and ssis/.

estate:
  name: WideWorldImporters Enterprise Legacy Estate
  phase: legacy-generation
  databases:
    oracle_erp: WWIGERP
    sqlserver_oltp: WideWorldImporters
    sqlserver_staging: WideWorldImporters_Staging
    sqlserver_dw: WideWorldImportersDW

oracle:
  WWI_MDM:
    domain: Master data
    description: "Customer, supplier, product and party master owned by the ERP."
    tables:
      - CUST_MASTER
      - CUST_ADDRESS
      - CUST_CONTACT
      - CUST_CLASSIFICATION
      - CUST_CREDIT_PROFILE
      - CUST_HIERARCHY
      - CUST_SEGMENT_ASSIGN
      - SUPP_MASTER
      - SUPP_ADDRESS
      - SUPP_CONTACT
      - SUPP_BANK_ACCOUNT
      - SUPP_CERTIFICATION
      - PRODUCT_MASTER
      - PRODUCT_CATEGORY
      - PRODUCT_HIERARCHY
      - PRODUCT_UOM_CONV
      - PRODUCT_SUBSTITUTE
      - PARTY_XREF
      - MDM_MERGE_HISTORY
  WWI_PROC:
    domain: Procurement
    description: "Requisition-to-receipt procurement transactions."
    tables:
      - REQUISITION_HDR
      - REQUISITION_LINE
      - SOURCING_EVENT
      - SUPPLIER_QUOTE
      - SUPPLIER_QUOTE_LINE
      - PURCHASE_ORDER_HDR
      - PURCHASE_ORDER_LINE
      - PO_CHANGE_ORDER
      - PO_RECEIPT_HDR
      - PO_RECEIPT_LINE
      - GOODS_RETURN_HDR
      - GOODS_RETURN_LINE
      - VENDOR_CONTRACT
      - VENDOR_CONTRACT_LINE
      - SUPPLIER_SCORECARD
  WWI_FIN:
    domain: Finance / accounts payable
    description: "AP invoices, payments and general ledger postings."
    tables:
      - AP_INVOICE_HDR
      - AP_INVOICE_LINE
      - AP_INVOICE_HOLD
      - AP_PAYMENT
      - AP_PAYMENT_APPLY
      - AP_AGING_SNAPSHOT
      - GL_ACCOUNT
      - GL_JOURNAL_HDR
      - GL_JOURNAL_LINE
      - GL_PERIOD_STATUS
      - COST_CENTER
      - COST_ALLOCATION_RULE
      - PAYMENT_TERMS
      - TAX_RATE
      - TAX_JURISDICTION
      - WITHHOLDING_RULE
  WWI_REF:
    domain: Reference data
    description: "Enterprise reference and code tables, fully refreshed weekly."
    tables:
      - CURRENCY_CODE
      - FX_RATE_DAILY
      - COUNTRY_REF
      - REGION_REF
      - CITY_REF
      - POSTAL_REF
      - UOM_REF
      - LANGUAGE_REF
      - INCOTERM_REF
      - PAYMENT_METHOD_REF
      - STATUS_CODE_REF
      - REASON_CODE_REF
      - CALENDAR_FISCAL
      - SOURCE_SYSTEM_REF
      - CODE_TRANSLATION
  WWI_AUDIT:
    domain: "Source-side change control"
    description: "ERP-side change capture and extract bookkeeping."
    tables:
      - CHANGE_LOG
      - EXTRACT_CONTROL
      - INTERFACE_ERROR
      - PURGE_LOG
  packages:
    - {schema: WWI_MDM, name: PKG_CUSTOMER_MASTER, description: Customer master maintenance and merge handling}
    - {schema: WWI_MDM, name: PKG_SUPPLIER_MASTER, description: Supplier master maintenance and certification checks}
    - {schema: WWI_MDM, name: PKG_PRODUCT_MASTER, description: "Product master, hierarchy and UOM conversion"}
    - {schema: WWI_PROC, name: PKG_PURCHASE_ORDER, description: Purchase order lifecycle and change orders}
    - {schema: WWI_PROC, name: PKG_RECEIPTS, description: Goods receipt matching and returns}
    - {schema: WWI_PROC, name: PKG_SUPPLIER_PERF, description: Supplier scorecard calculation}
    - {schema: WWI_FIN, name: PKG_AP_INVOICE, description: "AP invoice validation, holds and three-way match"}
    - {schema: WWI_FIN, name: PKG_AP_PAYMENT, description: "Payment run, application and withholding"}
    - {schema: WWI_FIN, name: PKG_GL_POSTING, description: GL journal creation and period control}
    - {schema: WWI_FIN, name: PKG_TAX, description: Tax rate resolution and jurisdiction lookup}
    - {schema: WWI_REF, name: PKG_FX, description: FX rate loading and currency conversion}
    - {schema: WWI_REF, name: PKG_CODE_TRANSLATION, description: Code translation between ERP and downstream systems}
    - {schema: WWI_AUDIT, name: PKG_EXTRACT_CONTROL, description: Extract watermark bookkeeping for downstream ETL}
    - {schema: WWI_AUDIT, name: PKG_DATA_QUALITY, description: "Source-side data-quality screening"}
  views:
    - {schema: WWI_MDM, name: V_CUSTOMER_EXTRACT}
