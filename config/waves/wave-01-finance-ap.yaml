wave: 1
name: finance-ap
title: Finance AP (supplier invoices, payments, aging, withholding)
description: >
  Oracle WWI_FIN accounts-payable subledger and the supplier master it keys on,
  through raw/stg to Dimension.Supplier, Fact.Supplier Payment,
  Fact.Supplier Transaction and the month-end AP aging / withholding steps.
  Fact.Payment is deliberately out of scope: FACT_Load_Payment joins
  Dimension.Customer and stg.CashReceipt/Lockbox/SEPA, so it is the
  customer-receipts (AR) fact even though stg.Payment is fed from
  raw.OracleApPayment. Tax/terms and cost-centre reference extracts are pulled
  in because the AP staging load depends on them and nothing else owns them
  as a domain; FX (STG_Load_Currency) is left out as estate-wide plumbing and
  consumed as a frozen synced input.
packages:
  - EXT_ORA_SupplierMaster
  - EXT_ORA_PaymentTerms
  - EXT_ORA_TaxRate
  - EXT_ORA_CostCenter
  - EXT_ORA_ApInvoiceHdr
  - EXT_ORA_ApInvoiceLine
  - EXT_ORA_ApPayment
  - EXT_ORA_ApPaymentApply
  - EXT_ORA_ApAging
  - EXT_SQL_SupplierTransactions
  - STG_Load_Supplier
  - STG_Load_TaxAndTerms
  - STG_Load_CostCenter
  - STG_Load_ApInvoice
  - DQ_Supplier_Screen
  - DIM_Load_Supplier
  - FACT_Load_SupplierPayment
  - FACT_Load_SupplierTransaction
  - FIN_Load_ApAging
  - FIN_Load_WithholdingTax
# Layers whose objects are consumed as shared conformed inputs rather than
# pulled into the wave when an out-of-slice package writes them.
shared_layers:
  - reference
  - dw-dimension
# work.* scratch is package-local by convention; a co-written scratch table
# is a contention finding, not a dependency to walk through.
scratch_layers:
  - staging-work
# Plumbing is reported separately, never counted as a closure leak.
plumbing_prefixes:
  - ETL.
  - ERR.
