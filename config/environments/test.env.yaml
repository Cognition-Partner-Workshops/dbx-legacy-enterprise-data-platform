# ---------------------------------------------------------------------------
# TEST environment definition for the WWI estate.
#
# TEST is the environment the business signs off in, so it is deliberately the
# closest to PROD: same schedules, same tolerances, smaller hardware. The two
# places it diverges from PROD are documented inline.
#
# No secret value appears here. Parameters marked `secret: true` name the
# environment variable that supplies the value at deploy time.
# ---------------------------------------------------------------------------

environment:
  code: TEST
  ssis_environment_name: WWI_TEST
  ssis_folder: WWI_TEST
  ssis_project: WWI_Estate
  description: >-
    User acceptance and regression environment. Loaded from a pseudonymised PROD
    extract each quarter. EU personal data is pseudonymised at extract time, so
    the EU consent job runs against surrogate contact rows here.
  refresh_policy: pseudonymised-extract-quarterly
  data_classification: pseudonymised
  regions_enabled: [NA, EU, APAC]

servers:
  oracle_erp:      oracle-erp-test.internal.example
  sqlserver_oltp:  sqltest01.internal.example
  sqlserver_dw:    sqltest02.internal.example
  ssis_catalog:    sqltest02.internal.example

ssis_environment_variables:
  - { parameter: OracleHost,                value: oracle-erp-test.internal.example, type: String, secret: false, env_var: ORACLE_HOST }
  - { parameter: OraclePort,                value: 1521,                             type: Int32,  secret: false, env_var: ORACLE_PORT }
  - { parameter: OracleService,             value: WWIGERPT,                         type: String, secret: false, env_var: ORACLE_SERVICE }
  - { parameter: OracleUser,                value: WWI_ETL_TEST,                     type: String, secret: false, env_var: ORACLE_USER }
  - { parameter: OraclePassword,            value: null,                             type: String, secret: true,  env_var: ORACLE_PASSWORD }
  - { parameter: SqlServerHost,             value: sqltest01.internal.example,       type: String, secret: false, env_var: SQLSERVER_HOST }
  - { parameter: SqlServerPort,             value: 1433,                             type: Int32,  secret: false, env_var: SQLSERVER_PORT }
  - { parameter: SqlServerUser,             value: WWI_ETL,                          type: String, secret: false, env_var: SQLSERVER_USER }
  - { parameter: SqlServerPassword,         value: null,                             type: String, secret: true,  env_var: SQLSERVER_PASSWORD }
  - { parameter: SqlServerOltpDb,           value: WideWorldImporters,               type: String, secret: false, env_var: SQLSERVER_OLTP_DB }
  - { parameter: SqlServerStagingDb,        value: WideWorldImporters_Staging,       type: String, secret: false, env_var: SQLSERVER_STAGING_DB }
  - { parameter: SqlServerDwDb,             value: WideWorldImportersDW,             type: String, secret: false, env_var: SQLSERVER_DW_DB }
  - { parameter: InboundFileRoot,           value: '\\wwi-files-test\landing\inbound',    type: String, secret: false, env_var: ETL_INBOUND_FILE_ROOT }
  - { parameter: ArchiveFileRoot,           value: '\\wwi-files-test\landing\archive',    type: String, secret: false, env_var: ETL_ARCHIVE_FILE_ROOT }
  - { parameter: RejectFileRoot,            value: '\\wwi-files-test\landing\quarantine', type: String, secret: false, env_var: ETL_REJECT_FILE_ROOT }
  - { parameter: DefaultBatchSize,          value: 50000,                            type: Int32,  secret: false, env_var: ETL_DEFAULT_BATCH_SIZE }
  - { parameter: SourceQueryTimeoutSeconds, value: 1800,                             type: Int32,  secret: false, env_var: ETL_SOURCE_QUERY_TIMEOUT_SECONDS }
  - { parameter: MaxRejectPercent,          value: 5,                                type: Int32,  secret: false, env_var: ETL_MAX_REJECT_PERCENT }
  - { parameter: EnvironmentCode,           value: TEST,                             type: String, secret: false, env_var: ETL_ENVIRONMENT_CODE }

etl_configuration:
  - { key: Daily.EnableLoad,             value: '1',   description: 'Master gate for the nightly run.' }
  - { key: Daily.MaxParallelPackages,    value: '4',   description: 'Half of PROD, matching the smaller box.' }
  - { key: Hourly.LookbackMinutes,       value: '90',  description: 'Same shape as PROD with a wider safety floor.' }
  - { key: Reject.MaxAttempts,           value: '5',   description: 'Reject reprocessing attempts before a row is parked.' }
  - { key: Reference.NA.StaleDays,       value: '10',  description: 'NA tax jurisdiction staleness tolerance.' }
  - { key: Reference.EU.StaleDays,       value: '7',   description: 'EU VAT rates change on notice; tighter window.' }
  - { key: Reference.APAC.StaleDays,     value: '14',  description: 'APAC GST classes are revised quarterly.' }
  - { key: Close.RequireFxComplete,      value: '1',   description: 'Close gates on a complete FX set, as in PROD.' }
  - { key: Purge.StagingRetentionDays,   value: '30',  description: 'Control history retention in staging.' }
  - { key: Purge.WarehouseRetentionDays, value: '400', description: 'Control history retention in the warehouse.' }

agent:
  # TEST runs the full schedule so that a regression in job wiring is caught
  # before PROD. The close jobs stay disabled and are started by the finance
  # test lead when a close rehearsal is scheduled.
  enabled_jobs:
    - WWI - Daily ETL
    - WWI - Hourly Incremental
    - WWI - Intraday Inventory Refresh
    - WWI - Customer Master Sync
    - WWI - File Ingestion
    - WWI - Weekly Reference Refresh
    - WWI - Weekly Maintenance
    - WWI - Reject Reprocessing
    - WWI - Control History Purge
    - WWI - ETL Health Check
  disabled_jobs:
    - WWI - Month End
    - WWI - Finance Close
  notify_operator: WWI ETL On-Call
  log_root: 'E:\WWI\Logs\Agent'
