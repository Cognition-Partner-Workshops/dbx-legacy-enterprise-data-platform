# ---------------------------------------------------------------------------
# PROD environment definition for the WWI estate.
#
# Changes to this file follow the change-advisory process; the deployment driver
# additionally refuses to run against PROD unless WWI_CONFIRM_PROD is set to
# I-UNDERSTAND.
#
# No secret value appears here. Parameters marked `secret: true` name the
# environment variable that supplies the value at deploy time, which the
# operator sources from the vault entry named in config/README.md.
# ---------------------------------------------------------------------------

environment:
  code: PROD
  ssis_environment_name: WWI_PROD
  ssis_folder: WWI_PROD
  ssis_project: WWI_Estate
  description: >-
    Production. Three regional trading days overlap, so the only true quiet
    window is 01:00-04:00 UTC and every schedule in sqlserver/agent is built
    around it.
  refresh_policy: none
  data_classification: personal-data-present
  regions_enabled: [NA, EU, APAC]

servers:
  oracle_erp:      oracle-erp-prod.internal.example
  sqlserver_oltp:  sqlprod-oltp.internal.example
  sqlserver_dw:    sqlprod-dw.internal.example
  ssis_catalog:    sqlprod-etl.internal.example

ssis_environment_variables:
  - { parameter: OracleHost,                value: oracle-erp-prod.internal.example, type: String, secret: false, env_var: ORACLE_HOST }
  - { parameter: OraclePort,                value: 1521,                             type: Int32,  secret: false, env_var: ORACLE_PORT }
  - { parameter: OracleService,             value: WWIGERP,                          type: String, secret: false, env_var: ORACLE_SERVICE }
  - { parameter: OracleUser,                value: WWI_ETL_READER,                   type: String, secret: false, env_var: ORACLE_USER }
  - { parameter: OraclePassword,            value: null,                             type: String, secret: true,  env_var: ORACLE_PASSWORD }
  - { parameter: SqlServerHost,             value: sqlprod-oltp.internal.example,    type: String, secret: false, env_var: SQLSERVER_HOST }
  - { parameter: SqlServerPort,             value: 1433,                             type: Int32,  secret: false, env_var: SQLSERVER_PORT }
  - { parameter: SqlServerUser,             value: WWI_ETL,                          type: String, secret: false, env_var: SQLSERVER_USER }
  - { parameter: SqlServerPassword,         value: null,                             type: String, secret: true,  env_var: SQLSERVER_PASSWORD }
  - { parameter: SqlServerOltpDb,           value: WideWorldImporters,               type: String, secret: false, env_var: SQLSERVER_OLTP_DB }
  - { parameter: SqlServerStagingDb,        value: WideWorldImporters_Staging,       type: String, secret: false, env_var: SQLSERVER_STAGING_DB }
  - { parameter: SqlServerDwDb,             value: WideWorldImportersDW,             type: String, secret: false, env_var: SQLSERVER_DW_DB }
  - { parameter: InboundFileRoot,           value: '\\wwi-files\landing\inbound',    type: String, secret: false, env_var: ETL_INBOUND_FILE_ROOT }
  - { parameter: ArchiveFileRoot,           value: '\\wwi-files\landing\archive',    type: String, secret: false, env_var: ETL_ARCHIVE_FILE_ROOT }
  - { parameter: RejectFileRoot,            value: '\\wwi-files\landing\quarantine', type: String, secret: false, env_var: ETL_REJECT_FILE_ROOT }
  - { parameter: DefaultBatchSize,          value: 100000,                           type: Int32,  secret: false, env_var: ETL_DEFAULT_BATCH_SIZE }
  - { parameter: SourceQueryTimeoutSeconds, value: 3600,                             type: Int32,  secret: false, env_var: ETL_SOURCE_QUERY_TIMEOUT_SECONDS }
  - { parameter: MaxRejectPercent,          value: 2,                                type: Int32,  secret: false, env_var: ETL_MAX_REJECT_PERCENT }
  - { parameter: EnvironmentCode,           value: PROD,                             type: String, secret: false, env_var: ETL_ENVIRONMENT_CODE }

etl_configuration:
  - { key: Daily.EnableLoad,             value: '1',    description: 'Master gate for the nightly run. Cleared by hand during an incident.' }
  - { key: Daily.MaxParallelPackages,    value: '8',    description: 'Raised from 6 after the 2019 hardware refresh.' }
  - { key: Hourly.LookbackMinutes,       value: '45',   description: 'Covers the replica lag seen on the busiest hour.' }
  - { key: Reject.MaxAttempts,           value: '5',    description: 'Reject reprocessing attempts before a row is parked.' }
  - { key: Reference.NA.StaleDays,       value: '7',    description: 'NA state and county tax tables are published weekly.' }
  - { key: Reference.EU.StaleDays,       value: '3',    description: 'EU VAT rates: a stale rate is a compliance issue, not an ETL one.' }
  - { key: Reference.APAC.StaleDays,     value: '14',   description: 'APAC GST classes are revised quarterly by the tax team.' }
  - { key: Close.RequireFxComplete,      value: '1',    description: 'A close cannot run without ECB, APAC morning and corporate NA rates.' }
  - { key: Purge.StagingRetentionDays,   value: '45',   description: 'Control history retention in staging.' }
  - { key: Purge.WarehouseRetentionDays, value: '1100', description: 'Three years plus a quarter, to satisfy the finance audit window.' }

agent:
  # Everything is enabled except the two close jobs, which the finance systems
  # team enables against the hand-maintained close calendar each period. Nobody
  # has been willing to automate that step.
  enabled_jobs:
    - WWI - Daily ETL
    - WWI - Hourly Incremental
    - WWI - Intraday Inventory Refresh
    - WWI - Customer Master Sync
    - WWI - File Ingestion
    - WWI - Weekly Reference Refresh
    - WWI - Weekly Maintenance
    - WWI - Reject Reprocessing
    - WWI - Control History Purge
    - WWI - ETL Health Check
  disabled_jobs:
    - WWI - Month End
    - WWI - Finance Close
  notify_operator: WWI ETL On-Call
  log_root: 'E:\WWI\Logs\Agent'
