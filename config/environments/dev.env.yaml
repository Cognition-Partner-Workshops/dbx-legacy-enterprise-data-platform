# ---------------------------------------------------------------------------
# DEV environment definition for the WWI estate.
#
# This file is the source for:
#   * the SSIS catalogue environment "WWI_DEV" (see
#     deployment/ssis/render_environment_sql.py)
#   * the sqlcmd variables the SQL Server deployment driver passes
#   * the operator-facing description of what DEV actually is
#
# Sensitive values are NEVER stored here. A parameter marked `secret: true`
# carries the name of the environment variable that supplies it at deploy time
# and nothing else.
# ---------------------------------------------------------------------------

environment:
  code: DEV
  ssis_environment_name: WWI_DEV
  ssis_folder: WWI_DEV
  description: >-
    Shared development environment. Restored from a masked PROD backup on the
    first Sunday of each month, which is why watermarks are reset by hand
    afterwards and why the nightly job is left disabled for the rest of that day.
  refresh_policy: masked-restore-monthly
  data_classification: masked
  regions_enabled: [NA, EU, APAC]

servers:
  oracle_erp:      oracle-erp-dev.internal.example
  sqlserver_oltp:  sqldev01.internal.example
  sqlserver_dw:    sqldev01.internal.example
  ssis_catalog:    sqldev01.internal.example

# SSIS catalogue environment variables. `parameter` names the environment
# variable; `env_var` is where the deploy driver reads its value. By default the
# variable is bound to the project parameter of the same name.
#
# `binds_to` overrides that. A password has no project parameter to bind to any
# more - a Sensitive project parameter cannot be read by an SSIS expression
# (0xC0017010) - so the two secret variables are bound to the connection
# managers' own CM.<connection>.Password project parameters instead. That is the
# supported catalog mechanism: still @object_type = 20, still @value_type = 'R',
# but the runtime applies the value to the connection manager object rather than
# handing it to the expression evaluator.
#
# There is no provider or TLS variable here. Both belong to the connection
# string as a whole, and the only way to bind a whole connection string at run
# time - a ConnectionString property expression or a CM.<name>.ConnectionString
# parameter - rebuilds the connection and throws the password away with it.
# They are therefore fixed in the connection manager literal that ships with the
# package; every value that can be bound property by property is bound here.
ssis_environment_variables:
  - { parameter: OracleHost,                value: oracle-erp-dev.internal.example, type: String, secret: false, env_var: ORACLE_HOST }
  - { parameter: OraclePort,                value: 1521,                            type: Int32,  secret: false, env_var: ORACLE_PORT }
  - { parameter: OracleService,             value: WWIGERPD,                        type: String, secret: false, env_var: ORACLE_SERVICE }
  - { parameter: OracleUser,                value: WWI_ETL_DEV,                     type: String, secret: false, env_var: ORACLE_USER }
  - parameter: OraclePassword
    value: null
    type: String
    secret: true
    env_var: ORACLE_PASSWORD
    binds_to: [CM.WWI_Oracle_ERP.Password]
  - { parameter: SqlServerHost,             value: sqldev01.internal.example,       type: String, secret: false, env_var: SQLSERVER_HOST }
  - { parameter: SqlServerPort,             value: 1433,                            type: Int32,  secret: false, env_var: SQLSERVER_PORT }
  - { parameter: SqlServerUser,             value: WWI_ETL,                         type: String, secret: false, env_var: SQLSERVER_USER }
  - parameter: SqlServerPassword
    value: null
    type: String
    secret: true
    env_var: SQLSERVER_PASSWORD
    binds_to: [CM.WWI_Source_DB.Password, CM.WWI_Staging_DB.Password, CM.WWI_DW_Destination_DB.Password]
  - { parameter: SqlServerOltpDb,           value: WideWorldImporters,              type: String, secret: false, env_var: SQLSERVER_OLTP_DB }
  - { parameter: SqlServerStagingDb,        value: WideWorldImporters_Staging,      type: String, secret: false, env_var: SQLSERVER_STAGING_DB }
  - { parameter: SqlServerDwDb,             value: WideWorldImportersDW,            type: String, secret: false, env_var: SQLSERVER_DW_DB }
  # WWI_LANDING_ROOT on the SSIS execution host, per config/landing-zone.yaml.
  - { parameter: InboundFileRoot,           value: 'C:\WWI\DEV\inbound',            type: String, secret: false, env_var: ETL_INBOUND_FILE_ROOT }
  - { parameter: ArchiveFileRoot,           value: 'C:\WWI\DEV\archive',            type: String, secret: false, env_var: ETL_ARCHIVE_FILE_ROOT }
  - { parameter: QuarantineFileRoot,        value: 'C:\WWI\DEV\quarantine',         type: String, secret: false, env_var: ETL_QUARANTINE_FILE_ROOT }
  - { parameter: DefaultBatchSize,          value: 10000,                           type: Int32,  secret: false, env_var: ETL_DEFAULT_BATCH_SIZE }
  - { parameter: SourceQueryTimeoutSeconds, value: 600,                             type: Int32,  secret: false, env_var: ETL_SOURCE_QUERY_TIMEOUT_SECONDS }
  - { parameter: MaxRejectPercent,          value: 25,                              type: Int32,  secret: false, env_var: ETL_MAX_REJECT_PERCENT }
  - { parameter: EnvironmentCode,           value: DEV,                             type: String, secret: false, env_var: ETL_ENVIRONMENT_CODE }

# Rows the deployment driver writes into etl.Configuration. These are the
# tier below the SSIS environment in the resolution order described in
# config/README.md.
etl_configuration:
  - { key: Daily.EnableLoad,            value: '1',   description: 'Master gate for the nightly run.' }
  - { key: Daily.MaxParallelPackages,   value: '2',   description: 'DEV has two cores to spare, no more.' }
  - { key: Hourly.LookbackMinutes,      value: '240', description: 'Wide lookback: DEV watermarks drift after a restore.' }
  - { key: Reject.MaxAttempts,          value: '5',   description: 'Reject reprocessing attempts before a row is parked.' }
  - { key: Reference.NA.StaleDays,      value: '30',  description: 'NA tax jurisdiction staleness tolerance.' }
  - { key: Reference.EU.StaleDays,      value: '30',  description: 'EU VAT rate staleness tolerance.' }
  - { key: Reference.APAC.StaleDays,    value: '30',  description: 'APAC GST class staleness tolerance.' }
  - { key: Close.RequireFxComplete,     value: '0',   description: 'DEV closes are allowed to run without every FX rate.' }
  - { key: Purge.StagingRetentionDays,  value: '14',  description: 'Control history retention in staging.' }
  - { key: Purge.WarehouseRetentionDays, value: '90', description: 'Control history retention in the warehouse.' }

# Agent behaviour that differs by environment. DEV runs almost nothing on a
# schedule; developers start jobs by hand.
agent:
  enabled_jobs:
    - WWI - Daily ETL
  disabled_jobs:
    - WWI - Hourly Incremental
    - WWI - Intraday Inventory Refresh
    - WWI - Customer Master Sync
    - WWI - File Ingestion
    - WWI - Weekly Reference Refresh
    - WWI - Weekly Maintenance
    - WWI - Month End
    - WWI - Finance Close
    - WWI - Reject Reprocessing
    - WWI - Control History Purge
    - WWI - ETL Health Check
  notify_operator: WWI ETL On-Call
  log_root: 'C:\WWI\DEV\work\Logs\Agent'
