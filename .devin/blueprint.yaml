# https://docs.devin.ai/onboard-devin/environment-yaml
# Databricks CLI + OIDC auth come from the org blueprint.
# PowerShell 7 for the deployment/ and validation/ .ps1 scripts.
initialize: |
  if ! command -v pwsh >/dev/null; then
    curl -fsSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
    sudo dpkg -i /tmp/packages-microsoft-prod.deb && rm -f /tmp/packages-microsoft-prod.deb
    sudo apt-get update -qq
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq powershell
  fi
# pyyaml is the only Python dependency (validation/, generators/, tools/).
maintenance: |
  python3 -m pip install --user -q pyyaml
knowledge:
  - name: test
    contents: |
      Offline, no server needed (see validation/README.md):
      python3 validation/static/run_all_checks.py
      python3 validation/checks/run_deep_checks.py
      python3 validation/static/run_negative_fixtures.py
      python3 validation/checks/run_check_fixtures.py
      pwsh -NoProfile -File validation/static/Test-ExecutionParameterBinding.ps1
      pwsh -NoProfile -File validation/static/Test-PlanConditionalEdge.ps1
