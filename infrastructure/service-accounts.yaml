# ---------------------------------------------------------------------------
# Service accounts for the WWI estate.
#
# Names and required permissions only. No passwords, no vault contents, no
# key material. Where a secret exists, the vault path is named so the operator
# knows where to look; the value never appears in this repository.
#
# The SQL Server side of these grants is scripted in sqlserver/security/.
# ---------------------------------------------------------------------------

conventions:
  naming: 'svc-wwi-<workload>, one account per workload, never shared'
  password_policy: >-
    Managed by the identity team. Rotation is manual and, for the two proxy
    accounts, requires re-running the agent deployment stage because the
    credential is recreated rather than updated.
  interactive_logon: denied for every service account except svc-wwi-files
  reason_for_svc_wwi_files_exception: >-
    The file share's own permissions are managed through a Windows GUI on the
    file server, and it is the only way anyone has found to do it.

accounts:

  - name: svc-wwi-etl
    type: Active Directory user
    used_by:
      - SQL Server Integration Services service on sqlprod-etl
      - SQL Agent proxy WWI_SSIS_Proxy
      - the SSIS connection managers where Kerberos delegation reaches
    permissions:
      sql_server:
        - 'WWI_ETL_ServerRole (VIEW SERVER STATE, VIEW ANY DEFINITION, CONNECT SQL)'
        - 'staging: WWI_StagingLoader'
        - 'warehouse: WWI_WarehouseLoader'
        - 'OLTP: WWI_ExtractReader, WWI_ChangeTrackingReader'
        - 'msdb: SQLAgentUserRole, WWI_ETL_JobOperator'
        - 'SSISDB: ssis_admin'
      oracle:
        - 'none - the Oracle extract authenticates as WWI_ETL_READER, a database account'
      windows:
        - 'Log on as a service on sqlprod-etl'
        - 'read/write on E:\WWI\Logs\Agent'
    secret_location: 'vault: wwi/<env>/ad/svc-wwi-etl'
    notes: >-
      The single most privileged account in the estate. It can write to every
      staging and warehouse schema. Splitting it per-domain has been proposed
      three times and never done, because the SSIS project has one set of
      connection managers.

  - name: svc-wwi-files
    type: Active Directory user
    used_by:
      - SQL Agent proxy WWI_FileOps_Proxy
      - the file-system steps of "WWI - File Ingestion"
    permissions:
      windows:
        - 'read/write/delete on \\wwi-files\landing (inbound, archive, quarantine, work, outbound)'
        - 'read/write on \\wwi-files-apac\landing\inbound\bank'
        - 'Log on as a batch job on sqlprod-etl'
      sql_server:
        - 'none - it never opens a database connection'
    secret_location: 'vault: wwi/<env>/ad/svc-wwi-files'
    notes: >-
      Separate from svc-wwi-etl because the file server is in a different
      administrative domain and will not accept the ETL account. This is the
      historical reason the estate has two Agent proxies rather than one.

  - name: svc-wwi-app
    type: Active Directory user
    used_by:
      - the WideWorldImporters application pool
    permissions:
      sql_server:
        - 'OLTP: the application roles shipped with the Microsoft sample, unchanged'
    secret_location: 'vault: wwi/<env>/ad/svc-wwi-app'
    notes: Listed for completeness. Owned by the application team, not the data platform team.

  - name: svc-wwi-report
    type: Active Directory user
    used_by:
      - the reporting gateway
    permissions:
      sql_server:
        - 'WWI_Reporting_ServerRole (VIEW SERVER STATE, CONNECT SQL)'
        - 'warehouse: WWI_WarehouseReader'
    secret_location: 'vault: wwi/<env>/ad/svc-wwi-report'

  - name: WWI_ETL
    type: SQL Server login
    used_by:
      - the deployment drivers
      - SSIS connection managers where Kerberos delegation does not hop
    permissions:
      sql_server:
        - 'WWI_ETL_ServerRole'
        - 'staging: WWI_StagingLoader'
        - 'warehouse: WWI_WarehouseLoader'
        - 'OLTP: WWI_ExtractReader, WWI_ChangeTrackingReader'
    secret_location: 'vault: wwi/<env>/sqlserver/wwi-etl, supplied as SQLSERVER_PASSWORD'
    notes: >-
      A SQL login in an otherwise Windows-authenticated estate. It exists
      because the double hop from the SSIS host to the file share and back to
      SQL Server does not delegate. Retiring it needs constrained delegation
      that nobody has configured.

  - name: WWI_ReportGateway
    type: SQL Server login
    used_by:
      - the legacy reporting gateway, which predates the domain trust
    permissions:
      sql_server:
        - 'WWI_Reporting_ServerRole'
        - 'warehouse: WWI_WarehouseReader'
    secret_location: 'vault: wwi/<env>/sqlserver/report-gateway'
    notes: The oldest credential in the estate. Every attempt to retire it has been deferred.

  - name: WWI_ETL_READER
    type: Oracle database account
    used_by:
      - the SSIS Oracle extract packages
    permissions:
      oracle:
        - 'CREATE SESSION'
        - 'SELECT on GL_JOURNAL_HEADER, GL_JOURNAL_LINE'
        - 'SELECT on AP_INVOICE_HEADER, AR_INVOICE_HEADER'
        - 'SELECT on FX_RATE_DAILY'
        - 'SELECT on the customer, supplier and product master tables'
        - 'INSERT on ETL_EXTRACT_LOG'
    secret_location: 'vault: wwi/<env>/oracle/etl-reader, supplied as ORACLE_PASSWORD'
    notes: >-
      Granted per table, never through a role, at the ERP team's insistence. A
      new source table is a change request, and that is the single biggest
      source of delay when the estate needs new ERP data.

  - name: WWI_RECON_READER
    type: Oracle database account
    used_by:
      - the WWIGERP_LINK linked server
    permissions:
      oracle:
        - 'CREATE SESSION'
        - 'SELECT on the GL_PERIOD_BALANCE materialised view'
    secret_location: 'vault: wwi/<env>/oracle/recon-reader'
    notes: >-
      Deliberately not the same account as the extract, so a runaway
      reconciliation query can be killed without stopping the nightly extract.

groups:
  - name: CONTOSO\WWI-DBA-PROD
    purpose: Platform DBAs. sysadmin on the PROD instances.
  - name: CONTOSO\WWI-DBA-TEST
    purpose: Platform DBAs. sysadmin on TEST.
  - name: CONTOSO\WWI-DBA-DEV
    purpose: Platform DBAs and senior developers. sysadmin on DEV.
  - name: CONTOSO\WWI-ETLOperators
    purpose: >-
      Run-book operators. Start and stop jobs, read job history, read the etl
      control views. Cannot alter a job or read raw or reject data.
  - name: CONTOSO\WWI-DataStewards
    purpose: >-
      Reject triage. Read and update err.*, read raw.* and stg.*. In DEV only,
      additionally db_datareader on staging.
  - name: CONTOSO\WWI-FinanceAnalysts
    purpose: Close reporting. Read the warehouse Fact and agg schemas.
