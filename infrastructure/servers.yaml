# ---------------------------------------------------------------------------
# Server and instance inventory for the WWI estate.
#
# Descriptive only. Nothing in infrastructure/ executes, provisions or connects
# to anything; this is the platform team's written picture of what exists, kept
# in the repository so that the deployment scripts and the run book agree with
# it.
#
# Host names are internal example names. Sizes are the current allocations as
# recorded by the platform team.
# ---------------------------------------------------------------------------

datacentres:
  - code: DC1
    location: Chicago
    role: primary
    notes: Everything PROD runs here except the APAC file server.
  - code: DC2
    location: Amsterdam
    role: disaster-recovery
    notes: >-
      Log-shipping target and the EU file share. Not a warm standby - a DR
      invocation is a manual, rehearsed, four-hour procedure.
  - code: DC3
    location: Singapore
    role: regional-file
    notes: >-
      Exists because the APAC bank feed cannot be delivered outside the region.
      A single file server; no database.

servers:

  # --- production ---------------------------------------------------------

  - hostname: sqlprod-oltp.internal.example
    datacentre: DC1
    role: SQL Server OLTP
    environment: PROD
    platform: Windows Server 2019
    sql_version: SQL Server 2019 Enterprise (15.0)
    instances:
      - name: MSSQLSERVER
        port: 1433
        databases: [WideWorldImporters]
        collation: Latin1_General_100_CI_AS
    cpu_cores: 24
    memory_gb: 256
    max_server_memory_gb: 224
    maxdop: 8
    availability: >-
      Two-node failover cluster instance on shared storage. Not an availability
      group - the 2016 upgrade to AGs was started and abandoned.
    notes: >-
      Change tracking is enabled on the Sales, Purchasing and Warehouse schemas
      with a seven-day retention, which is the constraint that sets the hourly
      incremental load's tolerance for being down.

  - hostname: sqlprod-dw.internal.example
    datacentre: DC1
    role: SQL Server warehouse
    environment: PROD
    platform: Windows Server 2019
    sql_version: SQL Server 2019 Enterprise (15.0)
    instances:
      - name: MSSQLSERVER
        port: 1433
        databases: [WideWorldImportersDW, WideWorldImporters_Staging]
        collation: Latin1_General_100_CI_AS
    cpu_cores: 32
    memory_gb: 512
    max_server_memory_gb: 448
    maxdop: 8
    availability: Single node with log shipping to DC2 every 15 minutes.
    notes: >-
      Staging and the warehouse share an instance. They were separated on paper
      in 2017 and never separated in fact, so a heavy staging load still affects
      warehouse query times - which is the reason for the 01:00-04:00 window.

  - hostname: sqlprod-etl.internal.example
    datacentre: DC1
    role: SSIS catalogue and SQL Agent
    environment: PROD
    platform: Windows Server 2019
    sql_version: SQL Server 2019 Standard (15.0)
    instances:
      - name: MSSQLSERVER
        port: 1433
        databases: [SSISDB]
        collation: Latin1_General_100_CI_AS
    cpu_cores: 16
    memory_gb: 128
    max_server_memory_gb: 96
    maxdop: 4
    availability: Single node. A rebuild from the deployment scripts is the recovery plan.
    notes: >-
      All SQL Agent jobs in sqlserver/agent run here, against remote databases.
      The Standard edition licence is why the SSIS catalogue cannot be in an
      availability group.

  - hostname: oracle-erp-prod.internal.example
    datacentre: DC1
    role: Oracle ERP
    environment: PROD
    platform: Oracle Linux 7
    oracle_version: Oracle Database 12c Release 2 (12.2.0.1)
    instances:
      - name: WWIGERP
        port: 1521
        service_names: [WWIGERP, WWIGERP_ETL]
        character_set: AL32UTF8
    cpu_cores: 16
    memory_gb: 192
    availability: Two-node RAC.
    notes: >-
      Owned by the ERP team, not the data platform team. The estate has a read
      account and a fixed extract window; schema changes arrive by email.
      WWIGERP_ETL is a separate service name so the extract can be throttled by
      resource manager without touching the application service.

  - hostname: wwi-files.internal.example
    datacentre: DC1
    role: File landing zone
    environment: PROD
    platform: Windows Server 2019
    shares:
      - path: \\wwi-files\landing
        purpose: inbound, archive, quarantine, work, outbound
        quota_gb: 4096
    notes: See config/landing-zone.yaml for the directory layout and retention.

  - hostname: wwi-files-apac.internal.example
    datacentre: DC3
    role: File landing zone (APAC)
    environment: PROD
    platform: Windows Server 2019
    shares:
      - path: \\wwi-files-apac\landing\inbound\bank
        purpose: APAC bank statements only
        quota_gb: 256
    notes: >-
      A regional share because the APAC bank will not deliver outside the
      region. The ingestion job reaches across the WAN for it, which is why that
      one feed has a longer step timeout than the others.

  # --- non-production -----------------------------------------------------

  - hostname: sqltest01.internal.example
    datacentre: DC1
    role: SQL Server OLTP
    environment: TEST
    platform: Windows Server 2019
    sql_version: SQL Server 2019 Standard (15.0)
    instances:
      - name: MSSQLSERVER
        port: 1433
        databases: [WideWorldImporters]
    cpu_cores: 8
    memory_gb: 64
    max_server_memory_gb: 48
    maxdop: 4

  - hostname: sqltest02.internal.example
    datacentre: DC1
    role: SQL Server warehouse, staging and SSIS catalogue
    environment: TEST
    platform: Windows Server 2019
    sql_version: SQL Server 2019 Standard (15.0)
    instances:
      - name: MSSQLSERVER
        port: 1433
        databases: [WideWorldImportersDW, WideWorldImporters_Staging, SSISDB]
    cpu_cores: 8
    memory_gb: 96
    max_server_memory_gb: 72
    maxdop: 4
    notes: >-
      One instance where PROD has three. This is the main reason a TEST timing
      result never predicts a PROD one.

  - hostname: oracle-erp-test.internal.example
    datacentre: DC1
    role: Oracle ERP
    environment: TEST
    platform: Oracle Linux 7
    oracle_version: Oracle Database 12c Release 2 (12.2.0.1)
    instances:
      - name: WWIGERPT
        port: 1521
        service_names: [WWIGERPT]
        character_set: AL32UTF8
    cpu_cores: 4
    memory_gb: 48

  - hostname: sqldev01.internal.example
    datacentre: DC1
    role: All SQL Server roles
    environment: DEV
    platform: Windows Server 2019
    sql_version: SQL Server 2019 Developer (15.0)
    instances:
      - name: MSSQLSERVER
        port: 1433
        databases: [WideWorldImporters, WideWorldImporters_Staging, WideWorldImportersDW, SSISDB]
    cpu_cores: 4
    memory_gb: 32
    max_server_memory_gb: 24
    maxdop: 2

  - hostname: oracle-erp-dev.internal.example
    datacentre: DC1
    role: Oracle ERP
    environment: DEV
    platform: Oracle Linux 7
    oracle_version: Oracle Database 12c Release 2 (12.2.0.1)
    instances:
      - name: WWIGERPD
        port: 1521
        service_names: [WWIGERPD]
        character_set: AL32UTF8
    cpu_cores: 2
    memory_gb: 24

  - hostname: wwi-deploy01.internal.example
    datacentre: DC1
    role: Deployment host
    environment: ALL
    platform: Windows Server 2019
    installed:
      - Visual Studio 2019 with the Integration Services projects extension
      - SQL Server command-line utilities (sqlcmd, bcp)
      - Oracle client 12.2 (32-bit and 64-bit)
      - ISDeploymentWizard
    notes: >-
      The only host that can build the .ispac. Everything in deployment/ is
      written to run from here; the shell variants exist for the Linux build
      agents, which can deploy but not build.
